
blueprint:
  name: "Window open - Climate off and restore"
  description: >
    Turns off a climate device when any selected window or door sensor
    has been open for a defined time. Restores the previous HVAC mode
    only after all selected sensors are closed.
  domain: automation

  input:
    window_entity:
      name: Window / door sensors
      description: Select one or more binary sensors (windows, doors, etc.).
      selector:
        entity:
          filter:
            - domain: binary_sensor
          multiple: true

    minimum_open_time:
      name: Minimum open time
      description: Seconds before turning off the climate device.
      default: 12
      selector:
        number:
          min: 0
          max: 120
          step: 1
          unit_of_measurement: seconds
          mode: slider

    climate_target:
      name: Climate device
      selector:
        entity:
          filter:
            - domain: climate

variables:
  window_entities: !input window_entity
  climate_entity: !input climate_target

mode: single
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input window_entity
    to: "on"
    for:
      seconds: !input minimum_open_time

conditions:
  - condition: template
    value_template: >
      {{ states(climate_entity)
         not in ['off', 'unknown', 'unavailable'] }}

actions:
  - variables:
      previous_hvac_mode: "{{ states(climate_entity) }}"

  - action: climate.turn_off
    target:
      entity_id: !input climate_target

  # Supports both multiple selections and existing single-sensor automations.
  - wait_template: >
      {% set sensors = [window_entities] if window_entities is string else window_entities %}
      {% set ns = namespace(all_closed=true) %}
      {% for sensor in sensors %}
        {% if not is_state(sensor, 'off') %}
          {% set ns.all_closed = false %}
        {% endif %}
      {% endfor %}
      {{ ns.all_closed }}

  - condition: template
    value_template: >
      {{ previous_hvac_mode in
         (state_attr(climate_entity, 'hvac_modes') or []) }}

  - action: climate.set_hvac_mode
    target:
      entity_id: !input climate_target
    data:
      hvac_mode: "{{ previous_hvac_mode }}"
