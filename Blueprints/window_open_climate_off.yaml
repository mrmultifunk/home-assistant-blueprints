# Window open - Climate off and restore
# Version: 1.6.1
blueprint:
  name: "Window open - Climate off and restore (v1.6.1)"
  author: "mrmultifunk"
  domain: automation
  description: |-
    **Smart window & door climate control** · **v1.6.1**

    Automatically pauses your thermostat when a door or window is open,
    then restores its previous HVAC mode after everything is closed.

    ### How it works

    1. **Open:** A selected door or window stays open for the configured
       *Minimum open time* → the thermostat switches off.
    2. **Wait:** Heating remains off as long as any selected contact is open.
    3. **Restore:** All contacts must remain closed throughout the
       *Restore delay* before the previous mode is restored.
       Reopening a contact resets the countdown.

    ### Additional features

    - **Multiple contacts:** Monitor several doors and windows together.
    - **Enforce off:** Turn the thermostat off again if another automation
      or a person switches it on, or allow manual overrides instead.
    - **Unavailable sensor warnings:** Show a Home Assistant notification
      if an `unknown` or `unavailable` contact blocks restoration for
      longer than the configured warning delay.
    - **Restart recovery:** Optionally save the previous HVAC mode in a
      dedicated `input_text` helper so it survives Home Assistant restarts.
      A selectable fallback mode is available when no saved mode exists.

    ### Important

    > **Exact recovery after a restart requires one dedicated `input_text`
    > helper per automation, without a fixed initial value.** Without it,
    > the blueprint cannot always determine the previous HVAC mode.

    Sensors that are `unknown` or `unavailable` **never count as closed**.
    They therefore prevent restoration until they recover.

    [Documentation and version history](https://github.com/mrmultifunk/home-assistant-blueprints#readme)
  input:
    window_entity:
      name: Window / door sensors
      description: Select one or more contact sensors.
      selector:
        entity:
          multiple: true
          filter:
            - domain: binary_sensor
              device_class: window
            - domain: binary_sensor
              device_class: door
            - domain: binary_sensor
              device_class: opening

    minimum_open_time:
      name: Minimum open time
      description: Seconds a sensor must be open before climate is switched off.
      default: 12
      selector:
        number:
          min: 0
          max: 120
          step: 1
          unit_of_measurement: seconds
          mode: slider

    restore_delay:
      name: Restore delay
      description: Seconds all contacts must remain closed before restoring.
      default: 0
      selector:
        number:
          min: 0
          max: 1800
          step: 10
          unit_of_measurement: seconds
          mode: slider

    climate_target:
      name: Climate device
      selector:
        entity:
          filter:
            - domain: climate

    enforce_off:
      name: Enforce off while window is open
      description: >
        On: turn the climate device off again if another automation or
        someone turns it on before the restore delay completes.
        Off: respect the override and cancel the pending restore.
      default: true
      selector:
        boolean: {}

    warn_unavailable_sensors:
      name: Warn about unavailable sensors
      description: Show a Home Assistant notification if an unavailable contact prevents restoring the climate device.
      default: true
      selector:
        boolean: {}

    unavailable_warning_delay:
      name: Sensor warning delay
      description: Seconds a sensor must remain unknown/unavailable before notifying. Only checked during a pending restore.
      default: 600
      selector:
        number:
          min: 60
          max: 3600
          step: 60
          unit_of_measurement: seconds
          mode: slider

    saved_mode_helper:
      name: Persistent HVAC mode helper (optional)
      description: >
        Choose a dedicated input_text helper to remember the previous
        HVAC mode across Home Assistant restarts. Leave empty if you do
        not want to create a helper. Do not set an initial value.
      default: ""
      selector:
        entity:
          filter:
            - domain: input_text

    restart_fallback_mode:
      name: Restart fallback mode (without helper)
      description: >
        Only used when Home Assistant starts/reloads, a window is open,
        the climate device is off and there is no saved mode. None is
        safest; choose Heat/Auto only if supported by your climate device.
        This cannot recover a lost mode when all windows are already closed.
      default: "none"
      selector:
        select:
          mode: dropdown
          options:
            - label: "None (do not guess)"
              value: "none"
            - label: Heat
              value: heat
            - label: Auto
              value: auto
            - label: Heat / cool
              value: heat_cool
            - label: Cool
              value: cool

variables:
  window_entities: !input window_entity
  climate_entity: !input climate_target
  restore_delay_input: !input restore_delay
  saved_mode_helper: !input saved_mode_helper
  enforce_off: !input enforce_off
  restart_fallback_mode: !input restart_fallback_mode
  warn_unavailable_sensors: !input warn_unavailable_sensors
  unavailable_warning_delay: !input unavailable_warning_delay

mode: single
max_exceeded: silent

triggers:
  - trigger: state
    id: contact_opened
    entity_id: !input window_entity
    to: "on"
    for:
      seconds: !input minimum_open_time

  - trigger: homeassistant
    id: startup
    event: start

  - trigger: event
    id: reload
    event_type: automation_reloaded

actions:
  - variables:
      blueprint_version: "1.6.1"
      sensor_warning_id: "{{ 'window_climate_sensor_' ~ (this.entity_id | replace('.', '_')) }}"

  # Clean up any stale warning if the sensors have already recovered or
  # notifications were disabled in the automation settings.
  - if:
      - condition: template
        value_template: >
          {% set sensors = [window_entities] if window_entities is string else window_entities %}
          {{ not warn_unavailable_sensors or
             (expand(sensors) | selectattr('state', 'in', ['unknown', 'unavailable']) | list | count) == 0 }}
    then:
      - action: persistent_notification.dismiss
        data:
          notification_id: "{{ sensor_warning_id }}"

  # Wait briefly for the climate integration to become available on restart.
  - if:
      - condition: template
        value_template: "{{ trigger.id in ['startup', 'reload'] }}"
    then:
      - wait_template: >
          {{ states(climate_entity) not in ['unknown', 'unavailable'] }}
        timeout:
          minutes: 2
        continue_on_timeout: true

  # Determine a mode to restore. A previously saved mode takes priority
  # during recovery. A fresh open event snapshots the CURRENT HVAC mode.
  - variables:
      previous_hvac_mode: >-
        {% set valid = ['heat', 'cool', 'heat_cool', 'auto', 'dry', 'fan_only'] %}
        {% set device_mode = states(climate_entity) %}
        {% set stored = states(saved_mode_helper) if saved_mode_helper else 'none' %}
        {% set sensors = [window_entities] if window_entities is string else window_entities %}
        {% set any_open = (expand(sensors) | selectattr('state', 'eq', 'on') | list | count) > 0 %}
        {% if trigger.id == 'contact_opened' and device_mode in valid %}
          {{ device_mode }}
        {% elif stored in valid %}
          {{ stored }}
        {% elif trigger.id in ['startup', 'reload'] and any_open and device_mode in valid %}
          {{ device_mode }}
        {% elif trigger.id in ['startup', 'reload'] and any_open
                and device_mode == 'off' and restart_fallback_mode in valid %}
          {{ restart_fallback_mode }}
        {% else %}
          none
        {% endif %}

  - condition: template
    value_template: >
      {{ previous_hvac_mode in
         ['heat', 'cool', 'heat_cool', 'auto', 'dry', 'fan_only'] }}

  # On recovery, a current non-off mode with a previously saved mode
  # is an external/manual activation. Respect the user's policy.
  - if:
      - condition: template
        value_template: >
          {{ trigger.id in ['startup', 'reload']
             and saved_mode_helper != ''
             and states(saved_mode_helper) in
               ['heat', 'cool', 'heat_cool', 'auto', 'dry', 'fan_only']
             and states(climate_entity) not in
               ['off', 'unknown', 'unavailable'] }}
    then:
      - if:
          - condition: template
            value_template: >
              {% set sensors = [window_entities] if window_entities is string else window_entities %}
              {{ not enforce_off
                 or (expand(sensors) | selectattr('state', 'eq', 'on') | list | count) == 0 }}
        then:
          - action: input_text.set_value
            target:
              entity_id: "{{ saved_mode_helper }}"
            data:
              value: "none"
          - action: persistent_notification.dismiss
            data:
              notification_id: "{{ sensor_warning_id }}"
          - stop: "External/manual climate activation respected during recovery."

  # If the climate is active on startup with all sensors closed and
  # no saved pending mode, there is nothing to recover.
  - if:
      - condition: template
        value_template: >
          {% set sensors = [window_entities] if window_entities is string else window_entities %}
          {{ trigger.id in ['startup', 'reload']
             and states(climate_entity) != 'off'
             and (expand(sensors) | selectattr('state', 'eq', 'on') | list | count) == 0 }}
    then:
      - stop: "No open contact or pending restoration."

  # Save the mode BEFORE switching off. A helper without an explicit
  # initial value retains its state across restarts.
  - if:
      - condition: template
        value_template: >
          {{ saved_mode_helper != ''
             and states(saved_mode_helper) not in
               ['heat', 'cool', 'heat_cool', 'auto', 'dry', 'fan_only']
             }}
    then:
      - action: input_text.set_value
        target:
          entity_id: "{{ saved_mode_helper }}"
        data:
          value: "{{ previous_hvac_mode }}"

  - if:
      - condition: template
        value_template: >
          {{ states(climate_entity) not in ['off', 'unknown', 'unavailable'] }}
    then:
      - action: climate.turn_off
        target:
          entity_id: !input climate_target

  - variables:
      restore_delay_seconds: >-
        {% if restore_delay_input is mapping %}
          {{ (restore_delay_input.get('hours', 0) | int(0)) * 3600
             + (restore_delay_input.get('minutes', 0) | int(0)) * 60
             + (restore_delay_input.get('seconds', 0) | int(0)) }}
        {% else %}
          {{ restore_delay_input | int(0) }}
        {% endif %}

  - variables:
      sensor_warning_sent: false

  # Keep supervising the device until the restore delay has elapsed.
  # New window-open triggers are ignored (mode: single), but all selected
  # sensor states are observed by the wait templates below.
  - repeat:
      while:
        - condition: template
          value_template: "{{ true }}"
      sequence:
        # Check every 30 seconds even if there are no state changes.
        # A fault only blocks restoration if no other contact is open.
        - wait_template: >
            {% set sensors = [window_entities] if window_entities is string else window_entities %}
            {% set entities = expand(sensors) %}
            {% set all_closed = sensors | count > 0 and
               (entities | selectattr('state', 'eq', 'off') | list | count) == sensors | count %}
            {% set opened = entities | selectattr('state', 'eq', 'on') | list | count %}
            {% set faulty = entities | selectattr('state', 'in', ['unknown', 'unavailable']) | list %}
            {% set ns = namespace(overdue=false) %}
            {% for sensor in faulty %}
              {% if as_timestamp(now()) - as_timestamp(sensor.last_changed) >= (unavailable_warning_delay | int(600)) %}
                {% set ns.overdue = true %}
              {% endif %}
            {% endfor %}
            {{ all_closed
               or states(climate_entity) not in ['off', 'unknown', 'unavailable']
               or (warn_unavailable_sensors and not sensor_warning_sent and opened == 0 and ns.overdue)
               or (sensor_warning_sent and faulty | count == 0) }}
          timeout:
            seconds: 30
          continue_on_timeout: true

        # Clear an outstanding warning immediately when all faulty
        # contacts recover, even if another contact remains open.
        - if:
            - condition: template
              value_template: >
                {% set sensors = [window_entities] if window_entities is string else window_entities %}
                {{ sensor_warning_sent and
                   (expand(sensors) | selectattr('state', 'in', ['unknown', 'unavailable']) | list | count) == 0 }}
          then:
            - action: persistent_notification.dismiss
              data:
                notification_id: "{{ sensor_warning_id }}"
            - variables:
                sensor_warning_sent: false

        # Display one notification per fault episode. The fixed ID
        # avoids duplicate notifications for this automation.
        - if:
            - condition: template
              value_template: >
                {% set sensors = [window_entities] if window_entities is string else window_entities %}
                {% set entities = expand(sensors) %}
                {% set opened = entities | selectattr('state', 'eq', 'on') | list | count %}
                {% set faulty = entities | selectattr('state', 'in', ['unknown', 'unavailable']) | list %}
                {% set ns = namespace(overdue=false) %}
                {% for sensor in faulty %}
                  {% if as_timestamp(now()) - as_timestamp(sensor.last_changed) >= (unavailable_warning_delay | int(600)) %}
                    {% set ns.overdue = true %}
                  {% endif %}
                {% endfor %}
                {{ warn_unavailable_sensors and not sensor_warning_sent
                   and states(climate_entity) == 'off' and opened == 0 and ns.overdue }}
          then:
            - action: persistent_notification.create
              data:
                notification_id: "{{ sensor_warning_id }}"
                title: "Climate restore blocked - sensor unavailable"
                message: >-
                  **Automation:** {{ this.attributes.friendly_name | default(this.entity_id) }}

                  **Climate device:** {{ state_attr(climate_entity, 'friendly_name') or climate_entity }}

                  The climate device cannot be restored because a selected
                  contact is unknown or unavailable. All contacts must be
                  closed for the full restore delay before heating resumes.

                  **Affected sensors:**
                  {% set sensors = [window_entities] if window_entities is string else window_entities %}
                  {% for s in expand(sensors) if s.state in ['unknown', 'unavailable'] %}
                  - {{ s.name }} ({{ s.entity_id }}): {{ s.state }}
                  {% endfor %}
            - variables:
                sensor_warning_sent: true

        # Handle external/manual activation while waiting for closure.
        - if:
            - condition: template
              value_template: >
                {{ states(climate_entity) not in ['off', 'unknown', 'unavailable'] }}
          then:
            - if:
                - condition: template
                  value_template: "{{ enforce_off }}"
              then:
                - action: climate.turn_off
                  target:
                    entity_id: !input climate_target
              else:
                - if:
                    - condition: template
                      value_template: "{{ saved_mode_helper != '' }}"
                  then:
                    - action: input_text.set_value
                      target:
                        entity_id: "{{ saved_mode_helper }}"
                      data:
                        value: "none"
                - action: persistent_notification.dismiss
                  data:
                    notification_id: "{{ sensor_warning_id }}"
                - stop: "Manual/other automation override respected."

        # Only start the restore countdown after ALL contacts are closed.
        - if:
            - condition: template
              value_template: >
                {% set sensors = [window_entities] if window_entities is string else window_entities %}
                {{ sensors | count > 0
                   and (expand(sensors) | selectattr('state', 'eq', 'off') | list | count)
                       == sensors | count }}
          then:
            - wait_for_trigger:
                - trigger: state
                  id: sensor_reopened
                  entity_id: !input window_entity
                  from: "off"
                - trigger: state
                  id: climate_activated
                  entity_id: !input climate_target
                  from: "off"
              timeout:
                seconds: "{{ restore_delay_seconds | int(0) }}"
              continue_on_timeout: true

            - if:
                - condition: template
                  value_template: >
                    {{ wait.completed and
                       states(climate_entity) not in ['off', 'unknown', 'unavailable'] }}
              then:
                - if:
                    - condition: template
                      value_template: "{{ enforce_off }}"
                  then:
                    - action: climate.turn_off
                      target:
                        entity_id: !input climate_target
                  else:
                    - if:
                        - condition: template
                          value_template: "{{ saved_mode_helper != '' }}"
                      then:
                        - action: input_text.set_value
                          target:
                            entity_id: "{{ saved_mode_helper }}"
                          data:
                            value: "none"
                    - action: persistent_notification.dismiss
                      data:
                        notification_id: "{{ sensor_warning_id }}"
                    - stop: "Manual/other automation override respected."

            - if:
                - condition: template
                  value_template: >
                    {% set sensors = [window_entities] if window_entities is string else window_entities %}
                    {{ not wait.completed
                       and states(climate_entity) == 'off'
                       and sensors | count > 0
                       and (expand(sensors) | selectattr('state', 'eq', 'off') | list | count)
                           == sensors | count }}
              then:
                - action: climate.set_hvac_mode
                  target:
                    entity_id: !input climate_target
                  data:
                    hvac_mode: "{{ previous_hvac_mode }}"

                - if:
                    - condition: template
                      value_template: "{{ saved_mode_helper != '' }}"
                  then:
                    - action: input_text.set_value
                      target:
                        entity_id: "{{ saved_mode_helper }}"
                      data:
                        value: "none"
                - action: persistent_notification.dismiss
                  data:
                    notification_id: "{{ sensor_warning_id }}"
                - stop: "Previous HVAC mode restored."
