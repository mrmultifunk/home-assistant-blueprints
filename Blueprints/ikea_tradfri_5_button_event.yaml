# IKEA TRÅDFRI E1524/E1810 – FUGA-konvertering til Zigbee2MQTT
# Version: 1.3.0
blueprint:
  name: "IKEA TRÅDFRI – FUGA-fjernbetjening (Zigbee2MQTT) v1.3.0"
  description: |-
    **IKEA TRÅDFRI · FUGA-fjernbetjening · v1.3.0**

    Vælg selv, hvad hver knap på din FUGA-kontakt skal gøre. Blueprintet understøtter **alle tre positioner** på den lille mekaniske omskifter. **Midten er standard.**

    ### Knapper – omskifter i midten (standard)

    ```text
    ┌─────────────┬─────────────┐
    │  ◀ VENSTRE  │  HØJRE ▶    │
    ├─────────────┴─────────────┤
    │       ⏻ TÆND/SLUK        │
    ├─────────────┬─────────────┤
    │  ☀ LYSERE   │  MØRKERE ☼  │
    └─────────────┴─────────────┘
    ```

    ### De andre omskifterpositioner

    - **Venstre:** Øverst venstre er **tænd/sluk**. Midterknappen er **venstre pil**. De øvrige knapper er uændrede.
    - **Højre:** Øverst venstre er **tænd/sluk**. Midterknappen er **link/parring** og kan normalt ikke bruges til en automation. De øvrige knapper er uændrede.

    Handlingerne er knyttet til **knappernes fysiske placering**. Blueprintet tilpasser Zigbee2MQTT-hændelserne efter den valgte omskifterposition. Du kan tilføje korte og lange tryk samt slip-handlinger. Ubrugte handlinger kan stå tomme.

    > **Bemærk:** Omskifterens position skal vælges manuelt. Kontroller gerne hver knaps `event_type` i Home Assistant, da den mekaniske mapping er udledt af FUGA-frontens symboler.

    **Husk at tildele handlinger:** Knapperne har ingen standardhandling. Vælg f.eks. *Lys → Skift (toggle)* under den ønskede knap. Handlinger fra en tidligere automation overføres ikke automatisk.

    **Fejlfinding:** Fjernbetjeningsvælgeren viser kun MQTT-event-entiteter. Ukendte knaphændelser får en forklaring i automationssporingen (`raw_button_event` og `button_event`).

    ### Valgfri Zigbee2MQTT-dæmpning

    Aktivér *Kontinuerlig dæmpning* for at bruge sol-knappernes lange tryk til
    `brightness_move` og deres slip-hændelser til `brightness_move: 0`.
    Normal korttrykstyring og alle øvrige handlinger er uændrede. Hvis et
    slip-event udebliver, stopper en sikkerheds-timeout kommandoen automatisk.
    Lysentiteten bruges kun til at foreslå enhedens Zigbee2MQTT friendly name;
    Home Assistant eksponerer ikke MQTT command_topic direkte i automationsskabeloner.
    Brug manuel override ved navneforskel. MQTT-meddelelser sendes uden retain.

    **Parallelle kørsler:** Dette blueprint anvender `mode: parallel` for at
    reagere øjeblikkeligt på slip-hændelser, mens en timeout venter. Egendefinerede
    handlinger kan derfor også køre samtidigt (tidligere var tilstanden `queued`).

    [FUGA-modellen på Printables](https://www.printables.com/model/93848-zigbee-til-danske-kontakter) · [Zigbee2MQTT – understøttede hændelser](https://www.zigbee2mqtt.io/devices/E1524_E1810.html)
  author: "mrmultifunk"
  domain: automation
  homeassistant:
    min_version: "2024.6.0"

  input:
    remote:
      name: "Fjernbetjening og omskifter"
      icon: mdi:remote
      input:
        remote_event:
          name: "Fjernbetjeningens hændelsesentitet"
          description: "Vælg MQTT-hændelsesentiteten fra Zigbee2MQTT, som slutter på _action. For eksempel event.lea_fjernbetjening_1_vaeg_action."
          selector:
            entity:
              filter:
                - domain: event
                  integration: mqtt

        switch_position:
          name: "Omskifterens position"
          description: "Vælg samme position som den lille fysiske omskifter. Midten er standard."
          default: middle
          selector:
            select:
              mode: dropdown
              options:
                - label: "Venstre – tænd/sluk øverst venstre, venstre pil i midten"
                  value: left
                - label: "Midten (standard) – venstre pil øverst, tænd/sluk i midten"
                  value: middle
                - label: "Højre – tænd/sluk øverst venstre, link/parring i midten"
                  value: right

    top_row:
      name: "1 · Øverst – venstre og højre"
      icon: mdi:arrow-left-right
      description: "De to øverste knapper. Funktionen af øverst venstre afhænger af omskifterens position."
      input:
        arrow_left_click_action:
          name: "ØVERST VENSTRE · Kort tryk"
          description: "Venstre pil i midterposition; tænd/sluk i venstre og højre position."
          default: []
          selector:
            action: {}

        arrow_right_click_action:
          name: "ØVERST HØJRE · ▶ Kort tryk"
          description: "Højre pil i alle tre positioner."
          default: []
          selector:
            action: {}

    middle_row:
      name: "2 · Midten – midterknappen"
      icon: mdi:power
      description: "Tænd/sluk i midterposition, venstre pil i venstre position. Link/parring i højre position."
      input:
        center_click_action:
          name: "MIDTEN · Kort tryk"
          description: "Tænd/sluk i midterposition, venstre pil i venstre position. Ingen programmerbar handling i højre position."
          default: []
          selector:
            action: {}

    bottom_row:
      name: "3 · Nederst – lysstyrke"
      icon: mdi:brightness-6
      description: "Stor sol til venstre (lysere), lille sol til højre (mørkere)."
      input:
        brightness_up_click_action:
          name: "NEDERST VENSTRE · ☀ Lysere"
          description: "Lysstyrke op – kort tryk i alle tre positioner."
          default: []
          selector:
            action: {}

        brightness_down_click_action:
          name: "NEDERST HØJRE · ☼ Mørkere"
          description: "Lysstyrke ned – kort tryk i alle tre positioner."
          default: []
          selector:
            action: {}

    z2m_dimming:
      name: "Zigbee2MQTT · Kontinuerlig dæmpning (valgfrit)"
      icon: mdi:brightness-6
      description: >-
        Hold sol-knapperne for kontinuerlig dæmpning og slip for at stoppe.
        Vælg en MQTT-lys-entitet for at bruge enhedens registrerede navn som
        Zigbee2MQTT friendly name. Dette er et best-effort opslag, ikke et
        direkte opslag af MQTT command_topic. Hvis navnet er anderledes i
        Zigbee2MQTT, angiv friendly name manuelt nedenfor.
        Funktionen er slået fra som standard.
      collapsed: true
      input:
        z2m_dimming_enabled:
          name: "Aktivér kontinuerlig Zigbee2MQTT-dæmpning"
          description: "Når aktiv, erstatter denne funktion de fire brugerdefinerede hold/slip-handlinger for de nederste knapper."
          default: false
          selector:
            boolean: {}

        z2m_dimming_light:
          name: "Lysentitet (automatisk navneforslag)"
          description: >-
            Vælg en Zigbee2MQTT-lys- eller gruppeentitet fra MQTT.
            Enhedens registrerede navn bruges som Zigbee2MQTT friendly name;
            det er ikke nødvendigvis det samme, hvis enheden er omdøbt.
          default: ""
          selector:
            entity:
              filter:
                - domain: light
                  integration: mqtt

        z2m_dimming_name_override:
          name: "Friendly name (manuel override, valgfrit)"
          description: >-
            Udfyld kun hvis det automatiske navn ikke svarer til friendly name
            i Zigbee2MQTT, eller hvis målgruppen ikke har en lysentitet.
            Skriv kun friendly name, ikke 'zigbee2mqtt/' eller '/set'.
          default: ""
          selector:
            text: {}

        z2m_dimming_base_topic:
          name: "Zigbee2MQTT base topic"
          description: "Normalt zigbee2mqtt. Ret hvis du har ændret base_topic i Zigbee2MQTT."
          default: zigbee2mqtt
          selector:
            text: {}

        z2m_dimming_speed:
          name: "Dæmpningshastighed (enheder/sekund)"
          default: 40
          selector:
            number:
              min: 10
              max: 150
              step: 5
              mode: slider

        z2m_dimming_timeout:
          name: "Sikkerheds-timeout (sekunder)"
          description: >-
            Stopper automatisk ved manglende slip-hændelse. Standard 15 sekunder.
            Vælg en værdi længere end et normalt langt tryk.
          default: 15
          selector:
            number:
              min: 5
              max: 60
              step: 1
              mode: slider

    hold_actions:
      name: "Avanceret · Lange tryk (valgfrit)"
      icon: mdi:gesture-tap-hold
      description: "Handlingen køres én gang, når et langt tryk registreres."
      collapsed: true
      input:
        arrow_left_hold_action:
          name: "ØVERST VENSTRE · Langt tryk"
          description: "Venstre pil i midterposition; tænd/sluk i venstre og højre position."
          default: []
          selector:
            action: {}

        arrow_right_hold_action:
          name: "ØVERST HØJRE · ▶ Langt tryk"
          description: "Langt tryk på højre pil."
          default: []
          selector:
            action: {}

        center_hold_action:
          name: "MIDTEN · Langt tryk"
          description: "Tænd/sluk i midterposition; venstre pil i venstre position. Ikke tilgængelig i højre position."
          default: []
          selector:
            action: {}

        brightness_up_hold_action:
          name: "NEDERST VENSTRE · ☀ Langt tryk"
          description: "Langt tryk på lysstyrke op."
          default: []
          selector:
            action: {}

        brightness_down_hold_action:
          name: "NEDERST HØJRE · ☼ Langt tryk"
          description: "Langt tryk på lysstyrke ned."
          default: []
          selector:
            action: {}

    release_actions:
      name: "Avanceret · Slip knap (valgfrit)"
      icon: mdi:gesture-tap-button
      description: "Kører når en knap slippes efter et langt tryk, hvis Zigbee2MQTT udsender en slip-hændelse."
      collapsed: true
      input:
        arrow_left_release_action:
          name: "ØVERST VENSTRE · Slip"
          description: "Slip venstre pil i midterposition; tænd/sluk har normalt ingen slip-hændelse."
          default: []
          selector:
            action: {}

        center_release_action:
          name: "MIDTEN · Slip (kun venstre position)"
          description: "Slip venstre pil på midterknappen, når omskifteren står til venstre."
          default: []
          selector:
            action: {}

        arrow_right_release_action:
          name: "ØVERST HØJRE · ▶ Slip"
          description: "Slip højre pil."
          default: []
          selector:
            action: {}

        brightness_up_release_action:
          name: "NEDERST VENSTRE · ☀ Slip"
          description: "Slip lysstyrke op."
          default: []
          selector:
            action: {}

        brightness_down_release_action:
          name: "NEDERST HØJRE · ☼ Slip"
          description: "Slip lysstyrke ned."
          default: []
          selector:
            action: {}

variables:
  switch_position: !input switch_position
  z2m_dimming_remote: !input remote_event
  z2m_dimming_enabled: !input z2m_dimming_enabled
  z2m_dimming_light: !input z2m_dimming_light
  z2m_dimming_name_override: !input z2m_dimming_name_override
  z2m_dimming_base_topic: !input z2m_dimming_base_topic
  z2m_dimming_speed: !input z2m_dimming_speed
  z2m_dimming_timeout: !input z2m_dimming_timeout

# Watchdog waits must not block subsequent release actions.
mode: parallel
max: 30
max_exceeded: silent

triggers:
  # Zigbee2MQTT event entities update their timestamp for each new event.
  # An explicit null 'to' follows the recommended HA event-entity pattern.
  - trigger: state
    entity_id: !input remote_event
    to: ~

conditions:
  # Only process state changes which contain an actual button event.
  - condition: template
    value_template: >
      {{ trigger.to_state is not none and
         trigger.to_state.attributes.get('event_type', '') != '' }}

actions:
  - variables:
      blueprint_version: "1.3.0"
      raw_button_event: "{{ trigger.to_state.attributes.get('event_type', '') if trigger.to_state else '' }}"
      # Normalize the hardware event to a logical physical FUGA position.
      # Existing action input keys retain their meanings in Middle mode.
      # Right-center is the physical link/pairing button (no action event).
      button_event: >-
        {% set ev = trigger.to_state.attributes.get('event_type', '') if trigger.to_state else '' -%}
        {% set left_map = {
          'toggle': 'arrow_left_click',
          'toggle_hold': 'arrow_left_hold',
          'arrow_left_click': 'toggle',
          'arrow_left_hold': 'toggle_hold',
          'arrow_left_release': 'middle_release'
        } -%}
        {% set right_map = {
          'toggle': 'arrow_left_click',
          'toggle_hold': 'arrow_left_hold',
          'arrow_left_click': '',
          'arrow_left_hold': '',
          'arrow_left_release': ''
        } -%}
        {{ left_map.get(ev, ev) if switch_position == 'left'
           else right_map.get(ev, ev) if switch_position == 'right'
           else ev }}


  # Derive the friendly name from the selected MQTT light device when possible.
  # HA templates do not expose the exact MQTT discovery command_topic.
  - variables:
      z2m_dimming_target_name: >-
        {% if z2m_dimming_name_override | trim != '' -%}
          {{ z2m_dimming_name_override | trim }}
        {%- elif z2m_dimming_light | trim != '' -%}
          {{ device_attr(z2m_dimming_light, 'name') | default('', true) | trim }}
        {%- endif %}
  - variables:
      z2m_dimming_topic: >-
        {% if z2m_dimming_target_name | trim != '' and z2m_dimming_base_topic | trim != '' -%}
          {{ z2m_dimming_base_topic | trim | trim('/') }}/{{ z2m_dimming_target_name | trim }}/set
        {%- endif %}

  # Built-in hold/release handling takes priority only when explicitly enabled.
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ z2m_dimming_enabled and
                 button_event in ['brightness_up_hold', 'brightness_down_hold',
                                  'brightness_up_release', 'brightness_down_release'] }}
        sequence:
          - if:
              - condition: template
                value_template: "{{ z2m_dimming_topic | trim == '' }}"
            then:
              - stop: >-
                  Zigbee2MQTT-dæmpning er aktiv, men mål-topic kunne ikke
                  bestemmes. Vælg en MQTT-lys-entitet eller angiv friendly name.
          - choose:
              # Hold initiates continuous movement. Watch for release or
              # the opposite direction. A lost release triggers the timeout.
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ button_event in ['brightness_up_hold', 'brightness_down_hold'] }}
                sequence:
                  - variables:
                      z2m_dimming_direction: >-
                        {{ 1 if button_event == 'brightness_up_hold' else -1 }}
                  - action: mqtt.publish
                    data:
                      topic: "{{ z2m_dimming_topic }}"
                      payload: >-
                        {{ {'brightness_move': (z2m_dimming_direction | int) *
                           (z2m_dimming_speed | int)} | to_json }}
                      retain: false
                  # A wait template also checks the current state, avoiding
                  # a missed release if it arrives during the MQTT publish.
                  - wait_template: >-
                      {% if button_event == 'brightness_up_hold' -%}
                        {{ state_attr(z2m_dimming_remote, 'event_type')
                           in ['brightness_up_release', 'brightness_down_hold', 'brightness_down_release'] }}
                      {%- else -%}
                        {{ state_attr(z2m_dimming_remote, 'event_type')
                           in ['brightness_down_release', 'brightness_up_hold', 'brightness_up_release'] }}
                      {%- endif %}
                    timeout:
                      seconds: "{{ z2m_dimming_timeout | int(15) }}"
                    continue_on_timeout: true
                  - if:
                      - condition: template
                        value_template: "{{ not wait.completed }}"
                    then:
                      # A stop is sent even when the remote fails to emit a release.
                      - action: mqtt.publish
                        data:
                          topic: "{{ z2m_dimming_topic }}"
                          payload: '{"brightness_move": 0}'
                          retain: false

              # Release is processed in a separate parallel run; never wait.
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ button_event in ['brightness_up_release', 'brightness_down_release'] }}
                sequence:
                  - action: mqtt.publish
                    data:
                      topic: "{{ z2m_dimming_topic }}"
                      payload: '{"brightness_move": 0}'
                      retain: false
          - stop: "Zigbee2MQTT-dæmpningshændelsen er behandlet."

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'toggle' }}"
        sequence: !input center_click_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'brightness_up_click' }}"
        sequence: !input brightness_up_click_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'brightness_down_click' }}"
        sequence: !input brightness_down_click_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'arrow_left_click' }}"
        sequence: !input arrow_left_click_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'arrow_right_click' }}"
        sequence: !input arrow_right_click_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'toggle_hold' }}"
        sequence: !input center_hold_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'brightness_up_hold' }}"
        sequence: !input brightness_up_hold_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'brightness_down_hold' }}"
        sequence: !input brightness_down_hold_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'arrow_left_hold' }}"
        sequence: !input arrow_left_hold_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'arrow_right_hold' }}"
        sequence: !input arrow_right_hold_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'brightness_up_release' }}"
        sequence: !input brightness_up_release_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'brightness_down_release' }}"
        sequence: !input brightness_down_release_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'arrow_left_release' }}"
        sequence: !input arrow_left_release_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'middle_release' }}"
        sequence: !input center_release_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'arrow_right_release' }}"
        sequence: !input arrow_right_release_action
    default:
      - stop: "Ingen understøttet knaphændelse. Kontrollér valgt MQTT-event-entitet og omskifterposition. Se raw_button_event og button_event i sporingen."
