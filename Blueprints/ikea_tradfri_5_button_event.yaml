# IKEA TRÅDFRI E1524/E1810 – FUGA-konvertering til Zigbee2MQTT
# Version: 1.11.0
blueprint:
  name: "IKEA TRÅDFRI – FUGA-fjernbetjening (Zigbee2MQTT) v1.11.0"
  description: |-
    **IKEA TRÅDFRI · FUGA-fjernbetjening · v1.11.0**

    Konfigurér kort tryk, langt tryk, slip og Zigbee2MQTT-dæmpning **under hver fysisk knap**. Vælg først omskifterpositionen under **Fjernbetjening og omskifter**.

    ### Knappernes placering (omskifter i midten)

    ```text
    ┌─────────────┬─────────────┐
    │  ◀ VENSTRE  │  HØJRE ▶    │
    ├─────────────┴─────────────┤
    │       ⏻ TÆND/SLUK        │
    ├─────────────┬─────────────┤
    │  ☀ LYSERE   │  MØRKERE ☼  │
    └─────────────┴─────────────┘
    ```

    **Omskifterens tre positioner:**
    - **Midten (standard):** Venstre pil øverst til venstre og tænd/sluk i midten.
    - **Venstre:** Tænd/sluk øverst til venstre og venstre pil i midten.
    - **Højre:** Tænd/sluk øverst til venstre og link/parring i midten. Linkknappen kan normalt ikke automatiseres.

    ### Sådan indstiller du knapperne

    **Alle knaphandlinger ét sted:** Vælg korttrykshandling, dæmpning, lys, manuelt MQTT-topic og eventuelle egne hold/slip-handlinger under den samme knap.

    **Kontinuerlig dæmpning (valgfrit):** Aktivér den under *Dæmpning · Generelle indstillinger*. Vælg derefter *Øg lysstyrken* eller *Sænk lysstyrken* under den relevante knap. Egne hold/slip-handlinger bruges, når den indbyggede dæmpning ikke overtager hændelsen.

    **Lys og MQTT-topics:** Vælg én eller flere lysentiteter under hver knap, der skal dæmpe. Alternativt kan du angive et præcist MQTT-topic samme sted. Knapper uden valgte mål sender ikke dæmpekommandoer.

    **Slip og sikkerhed:** Lyset stopper normalt, når knappen slippes (`brightness_move: 0`). Hvis slip-hændelsen udebliver, sender blueprintet automatisk stop efter den valgte sikkerheds-timeout.

    ### Vigtigt at vide

    Kontinuerlig dæmpning på **øverst venstre** kræver omskifteren i **midten**; på **midterknappen** kræver den omskifteren til **venstre**. Øverst højre og begge nederste knapper understøtter alle positioner. Tænd/sluk-funktionen udsender ikke en slip-hændelse og kan derfor ikke bruges til denne type kontinuerlig dæmpning.

    **Fejlfinding:** Kontrollér at omskifterpositionen er valgt korrekt, og brug *Vis anvendte MQTT-topics (diagnose)* til at se de topics, som blueprintet anvender. Entitets-ID bruges kun som et kvalificeret gæt på Zigbee2MQTT's friendly name. Ukendte knaphændelser kan undersøges i automationens spor (`raw_button_event` og `button_event`).

    [FUGA-modellen på Printables](https://www.printables.com/model/93848-zigbee-til-danske-kontakter) · [Zigbee2MQTT – enhedshændelser](https://www.zigbee2mqtt.io/devices/E1524_E1810.html)
  author: "mrmultifunk"
  domain: automation
  homeassistant:
    min_version: "2024.6.0"

  input:
    remote:
      name: "Fjernbetjening og omskifter"
      icon: mdi:remote
      input:
        remote_event:
          name: "Fjernbetjeningens hændelsesentitet"
          description: "Vælg MQTT-hændelsesentiteten fra Zigbee2MQTT, som slutter på _action. For eksempel event.lea_fjernbetjening_1_vaeg_action."
          selector:
            entity:
              filter:
                - domain: event
                  integration: mqtt

        switch_position:
          name: "Omskifterens position"
          description: "Vælg samme position som den lille fysiske omskifter. Midten er standard."
          default: middle
          selector:
            select:
              mode: dropdown
              options:
                - label: "Venstre – tænd/sluk øverst venstre, venstre pil i midten"
                  value: left
                - label: "Midten (standard) – venstre pil øverst, tænd/sluk i midten"
                  value: middle
                - label: "Højre – tænd/sluk øverst venstre, link/parring i midten"
                  value: right

    z2m_dimming:
      name: "Dæmpning · Generelle indstillinger"
      icon: mdi:brightness-6
      description: >-
        Aktivér dæmpning, justér hastighed og sikkerheds-timeout.
        Vælg lys og eventuelle manuelle MQTT-topics under hver enkelt knap.
      collapsed: true
      input:
        z2m_dimming_enabled:
          name: "Aktivér kontinuerlig Zigbee2MQTT-dæmpning"
          description: "Når aktiv, erstatter dæmpningen kun hold/slip for knapper, som nedenfor er sat til Øg lysstyrken eller Sænk lysstyrken og har en slip-hændelse."
          default: false
          selector:
            boolean: {}

        z2m_dimming_debug_topics:
          name: "Vis anvendte MQTT-topics (diagnose)"
          description: >-
            Når aktiv, vises en Home Assistant-notifikation ved langt
            tryk med automatisk gættede og faktisk anvendte topics.
            Slå fra igen efter kontrol. Samme notifikation opdateres,
            så der ikke dannes mange separate beskeder.
          default: false
          selector:
            boolean: {}

        z2m_dimming_speed:
          name: "Dæmpningshastighed (enheder/sekund)"
          default: 40
          selector:
            number:
              min: 10
              max: 150
              step: 5
              mode: slider

        z2m_dimming_timeout:
          name: "Sikkerheds-timeout (sekunder)"
          description: >-
            Stopper automatisk ved manglende slip-hændelse. Standard 15 sekunder.
            Vælg en værdi længere end et normalt langt tryk.
          default: 15
          selector:
            number:
              min: 5
              max: 60
              step: 1
              mode: slider

        z2m_dimming_base_topic:
          name: "Zigbee2MQTT base topic"
          description: "Normalt zigbee2mqtt. Ret hvis du har ændret base_topic i Zigbee2MQTT."
          default: zigbee2mqtt
          selector:
            text: {}

    z2m_dimming_top_left_section:
      name: "1 · Øverst venstre ◀"
      icon: mdi:arrow-left
      description: >-
        Venstre pil i midterposition. Tænd/sluk i venstre/højre position (ingen slip-hændelse). Alle handlinger og lysmål for denne knap findes her.
        For dæmpning skal du vælge mindst ét lys eller MQTT-topic under knappen.
      collapsed: true
      input:
        arrow_left_click_action:
          name: "Kort tryk"
          description: "Venstre pil i midterposition; tænd/sluk i venstre og højre position."
          default: []
          selector:
            action: {}

        z2m_dimming_top_left_mode:
          name: "Langt tryk · Funktion"
          description: "Kontinuerlig dæmpning virker kun med omskifteren i MIDTEN (venstre pil)."
          default: custom
          selector:
            select:
              mode: dropdown
              options:
                - label: "Brug egen handling (nedenfor)"
                  value: custom
                - label: "Øg lysstyrken"
                  value: up
                - label: "Sænk lysstyrken"
                  value: down

        z2m_dimming_top_left_lights:
          name: "Lys (vælg flere)"
          description: >-
            Vælg lys til denne knap. Manuelt MQTT-topic kan bruges
            nedenfor, hvis topic-gættet ikke passer.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: light
                  integration: mqtt

        z2m_dimming_top_left_topics:
          name: "Manuelle MQTT-topics (valgfrit)"
          description: >-
            Valgfrit. Skriv Zigbee2MQTT friendly name eller fuldt MQTT-topic,
            ét pr. linje, hvis topic-gættet er forkert. Kombineres med valgte
            lys ovenfor. Fjern lysvalget for kun at bruge det manuelle topic.
          default: ""
          selector:
            text:
              multiline: true

        arrow_left_hold_action:
          name: "Egen handling · Langt tryk"
          description: "Bruges, når du vælger 'Brug egen handling (nedenfor)' ovenfor."
          default: []
          selector:
            action: {}

        arrow_left_release_action:
          name: "Egen handling · Slip"
          description: "Bruges kun når knappen ikke anvender indbygget dæmpning."
          default: []
          selector:
            action: {}

    z2m_dimming_top_right_section:
      name: "2 · Øverst højre ▶"
      icon: mdi:arrow-right
      description: >-
        Højre pil i alle omskifterpositioner. Alle handlinger og lysmål for denne knap findes her.
        For dæmpning skal du vælge mindst ét lys eller MQTT-topic under knappen.
      collapsed: true
      input:
        arrow_right_click_action:
          name: "Kort tryk"
          description: "Højre pil i alle tre positioner."
          default: []
          selector:
            action: {}

        z2m_dimming_top_right_mode:
          name: "Langt tryk · Funktion"
          description: "Virker i alle tre omskifterpositioner."
          default: custom
          selector:
            select:
              mode: dropdown
              options:
                - label: "Brug egen handling (nedenfor)"
                  value: custom
                - label: "Øg lysstyrken"
                  value: up
                - label: "Sænk lysstyrken"
                  value: down

        z2m_dimming_top_right_lights:
          name: "Lys (vælg flere)"
          description: >-
            Vælg lys til denne knap. Manuelt MQTT-topic kan bruges
            nedenfor, hvis topic-gættet ikke passer.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: light
                  integration: mqtt

        z2m_dimming_top_right_topics:
          name: "Manuelle MQTT-topics (valgfrit)"
          description: >-
            Valgfrit. Skriv Zigbee2MQTT friendly name eller fuldt MQTT-topic,
            ét pr. linje, hvis topic-gættet er forkert. Kombineres med valgte
            lys ovenfor. Fjern lysvalget for kun at bruge det manuelle topic.
          default: ""
          selector:
            text:
              multiline: true

        arrow_right_hold_action:
          name: "Egen handling · Langt tryk"
          description: "Bruges, når du vælger 'Brug egen handling (nedenfor)' ovenfor."
          default: []
          selector:
            action: {}

        arrow_right_release_action:
          name: "Egen handling · Slip"
          description: "Bruges kun når knappen ikke anvender indbygget dæmpning."
          default: []
          selector:
            action: {}

    z2m_dimming_center_section:
      name: "3 · Midten ⏻"
      icon: mdi:power
      description: >-
        Tænd/sluk i midten, venstre pil i venstre position, link/parring i højre position. Alle handlinger og lysmål for denne knap findes her.
        For dæmpning skal du vælge mindst ét lys eller MQTT-topic under knappen.
      collapsed: true
      input:
