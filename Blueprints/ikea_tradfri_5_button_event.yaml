          name: "Kort tryk"
          description: "Tænd/sluk i midterposition, venstre pil i venstre position. Ingen programmerbar handling i højre position."
          default: []
          selector:
            action: {}

        z2m_dimming_center_mode:
          name: "Langt tryk · Funktion"
          description: "Kontinuerlig dæmpning virker kun med omskifteren til VENSTRE (venstre pil). Tænd/sluk har ikke en slip-hændelse."
          default: custom
          selector:
            select:
              mode: dropdown
              options:
                - label: "Brug egen handling (nedenfor)"
