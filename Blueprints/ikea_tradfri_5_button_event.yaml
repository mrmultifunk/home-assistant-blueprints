# IKEA TRÅDFRI E1524/E1810 – FUGA-konvertering til Zigbee2MQTT
# Version: 1.2.1
blueprint:
  name: "IKEA TRÅDFRI – FUGA-fjernbetjening (Zigbee2MQTT) v1.2.1"
  description: |-
    **IKEA TRÅDFRI · FUGA-fjernbetjening · v1.2.1**

    Vælg selv, hvad hver knap på din FUGA-kontakt skal gøre.
    Blueprintet understøtter **alle tre positioner** på den lille
    mekaniske omskifter. **Midten er standard.**

    ### Knapper – omskifter i midten (standard)

    ```text
    ┌─────────────┬─────────────┐
    │  ◀ VENSTRE  │  HØJRE ▶    │
    ├─────────────┴─────────────┤
    │       ⏻ TÆND/SLUK        │
    ├─────────────┬─────────────┤
    │  ☀ LYSERE   │  MØRKERE ☼  │
    └─────────────┴─────────────┘
    ```

    ### De andre omskifterpositioner

    - **Venstre:** Øverst venstre er **tænd/sluk**. Midterknappen
      er **venstre pil**. De øvrige knapper er uændrede.
    - **Højre:** Øverst venstre er **tænd/sluk**. Midterknappen
      er **link/parring** og kan normalt ikke bruges til en
      automation. De øvrige knapper er uændrede.

    Handlingerne er knyttet til **knappernes fysiske placering**.
    Blueprintet tilpasser Zigbee2MQTT-hændelserne efter den valgte
    omskifterposition. Du kan tilføje korte og lange tryk samt
    slip-handlinger. Ubrugte handlinger kan stå tomme.

    > **Bemærk:** Omskifterens position skal vælges manuelt.
    > Kontroller gerne hver knaps `event_type` i Home Assistant,
    > da den mekaniske mapping er udledt af FUGA-frontens symboler.

    [FUGA-modellen på Printables](https://www.printables.com/model/93848-zigbee-til-danske-kontakter)
    · [Zigbee2MQTT – understøttede hændelser](https://www.zigbee2mqtt.io/devices/E1524_E1810.html)
  author: "mrmultifunk"
  domain: automation
  homeassistant:
    min_version: "2024.6.0"

  input:
    remote:
      name: "Fjernbetjening og omskifter"
      icon: mdi:remote
      input:
        remote_event:
          name: "Fjernbetjeningens hændelsesentitet"
          description: "Vælg Zigbee2MQTT-entiteten der slutter på _action, f.eks. event.lea_fjernbetjening_1_vaeg_action."
          selector:
            entity:
              filter:
                - domain: event

        switch_position:
          name: "Omskifterens position"
          description: "Vælg samme position som den lille fysiske omskifter. Midten er standard."
          default: middle
          selector:
            select:
              mode: dropdown
              options:
                - label: "Venstre – tænd/sluk øverst venstre, venstre pil i midten"
                  value: left
                - label: "Midten (standard) – venstre pil øverst, tænd/sluk i midten"
                  value: middle
                - label: "Højre – tænd/sluk øverst venstre, link/parring i midten"
                  value: right

    top_row:
      name: "1 · Øverst – venstre og højre"
      icon: mdi:arrow-left-right
      description: "De to øverste knapper. Funktionen af øverst venstre afhænger af omskifterens position."
      input:
        arrow_left_click_action:
          name: "ØVERST VENSTRE · Kort tryk"
          description: "Venstre pil i midterposition; tænd/sluk i venstre og højre position."
          default: []
          selector:
            action: {}

        arrow_right_click_action:
          name: "ØVERST HØJRE · ▶ Kort tryk"
          description: "Højre pil i alle tre positioner."
          default: []
          selector:
            action: {}

    middle_row:
      name: "2 · Midten – midterknappen"
      icon: mdi:power
      description: "Tænd/sluk i midterposition, venstre pil i venstre position. Link/parring i højre position."
      input:
        center_click_action:
          name: "MIDTEN · Kort tryk"
          description: "Tænd/sluk i midterposition, venstre pil i venstre position. Ingen programmerbar handling i højre position."
          default: []
          selector:
            action: {}

    bottom_row:
      name: "3 · Nederst – lysstyrke"
      icon: mdi:brightness-6
      description: "Stor sol til venstre (lysere), lille sol til højre (mørkere)."
      input:
        brightness_up_click_action:
          name: "NEDERST VENSTRE · ☀ Lysere"
          description: "Lysstyrke op – kort tryk i alle tre positioner."
          default: []
          selector:
            action: {}

        brightness_down_click_action:
          name: "NEDERST HØJRE · ☼ Mørkere"
          description: "Lysstyrke ned – kort tryk i alle tre positioner."
          default: []
          selector:
            action: {}

    hold_actions:
      name: "Avanceret · Lange tryk (valgfrit)"
      icon: mdi:gesture-tap-hold
      description: "Handlingen køres én gang, når et langt tryk registreres."
      collapsed: true
      input:
        arrow_left_hold_action:
          name: "ØVERST VENSTRE · Langt tryk"
          description: "Venstre pil i midterposition; tænd/sluk i venstre og højre position."
          default: []
          selector:
            action: {}

        arrow_right_hold_action:
          name: "ØVERST HØJRE · ▶ Langt tryk"
          description: "Langt tryk på højre pil."
          default: []
          selector:
            action: {}

        center_hold_action:
          name: "MIDTEN · Langt tryk"
          description: "Tænd/sluk i midterposition; venstre pil i venstre position. Ikke tilgængelig i højre position."
          default: []
          selector:
            action: {}

        brightness_up_hold_action:
          name: "NEDERST VENSTRE · ☀ Langt tryk"
          description: "Langt tryk på lysstyrke op."
          default: []
          selector:
            action: {}

        brightness_down_hold_action:
          name: "NEDERST HØJRE · ☼ Langt tryk"
          description: "Langt tryk på lysstyrke ned."
          default: []
          selector:
            action: {}

    release_actions:
      name: "Avanceret · Slip knap (valgfrit)"
      icon: mdi:gesture-tap-button
      description: "Kører når en knap slippes efter et langt tryk, hvis Zigbee2MQTT udsender en slip-hændelse."
      collapsed: true
      input:
        arrow_left_release_action:
          name: "ØVERST VENSTRE · Slip"
          description: "Slip venstre pil i midterposition; tænd/sluk har normalt ingen slip-hændelse."
          default: []
          selector:
            action: {}

        center_release_action:
          name: "MIDTEN · Slip (kun venstre position)"
          description: "Slip venstre pil på midterknappen, når omskifteren står til venstre."
          default: []
          selector:
            action: {}

        arrow_right_release_action:
          name: "ØVERST HØJRE · ▶ Slip"
          description: "Slip højre pil."
          default: []
          selector:
            action: {}

        brightness_up_release_action:
          name: "NEDERST VENSTRE · ☀ Slip"
          description: "Slip lysstyrke op."
          default: []
          selector:
            action: {}

        brightness_down_release_action:
          name: "NEDERST HØJRE · ☼ Slip"
          description: "Slip lysstyrke ned."
          default: []
          selector:
            action: {}

variables:
  switch_position: !input switch_position

mode: queued
max: 20
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input remote_event

conditions:
  # Ignore attribute-only updates and unavailable transitions.
  - condition: template
    value_template: >
      {{ trigger.to_state is not none
         and (trigger.from_state is none or
              trigger.to_state.state != trigger.from_state.state) }}

actions:
  - variables:
      blueprint_version: "1.2.1"
      raw_button_event: "{{ trigger.to_state.attributes.get('event_type', '') if trigger.to_state else '' }}"
      # Normalize the hardware event to a logical physical FUGA position.
      # Existing action input keys retain their meanings in Middle mode.
      # Right-center is the physical link/pairing button (no action event).
      button_event: >-
        {% set ev = trigger.to_state.attributes.get('event_type', '') if trigger.to_state else '' -%}
        {% set left_map = {
          'toggle': 'arrow_left_click',
          'toggle_hold': 'arrow_left_hold',
          'arrow_left_click': 'toggle',
          'arrow_left_hold': 'toggle_hold',
          'arrow_left_release': 'middle_release'
        } -%}
        {% set right_map = {
          'toggle': 'arrow_left_click',
          'toggle_hold': 'arrow_left_hold',
          'arrow_left_click': '',
          'arrow_left_hold': '',
          'arrow_left_release': ''
        } -%}
        {{ left_map.get(ev, ev) if switch_position == 'left'
           else right_map.get(ev, ev) if switch_position == 'right'
           else ev }}

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'toggle' }}"
        sequence: !input center_click_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'brightness_up_click' }}"
        sequence: !input brightness_up_click_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'brightness_down_click' }}"
        sequence: !input brightness_down_click_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'arrow_left_click' }}"
        sequence: !input arrow_left_click_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'arrow_right_click' }}"
        sequence: !input arrow_right_click_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'toggle_hold' }}"
        sequence: !input center_hold_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'brightness_up_hold' }}"
        sequence: !input brightness_up_hold_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'brightness_down_hold' }}"
        sequence: !input brightness_down_hold_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'arrow_left_hold' }}"
        sequence: !input arrow_left_hold_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'arrow_right_hold' }}"
        sequence: !input arrow_right_hold_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'brightness_up_release' }}"
        sequence: !input brightness_up_release_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'brightness_down_release' }}"
        sequence: !input brightness_down_release_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'arrow_left_release' }}"
        sequence: !input arrow_left_release_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'middle_release' }}"
        sequence: !input center_release_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'arrow_right_release' }}"
        sequence: !input arrow_right_release_action
