# IKEA TRÅDFRI E1524/E1810 Zigbee2MQTT event-based 5-button remote
# FUGA wall switch physical button mapping (as pictured).
# Version: 1.1.0
blueprint:
  name: "IKEA TRÅDFRI 5-button – FUGA layout (Z2M) v1.1.0"
  description: |-
    **IKEA TRÅDFRI 5-button / FUGA** · **v1.1.0**

    Configure each action by the **physical position** of the button
    on the FUGA-style wall switch instead of the original round puck.

    ### Physical button layout

    ```text
      ┌────────────┬────────────┐
      │ ◀ TOP LEFT │ TOP RIGHT ▶│
      ├────────────┴────────────┤
      │       ⏻ POWER          │
      ├────────────┬────────────┤
      │ ☀+ BRIGHTER│ DIMMER ☼−  │
      └────────────┴────────────┘
    ```

    ### Zigbee2MQTT mapping

    - **Top left ◀** → `arrow_left_click`
    - **Top right ▶** → `arrow_right_click`
    - **Middle ⏻** → `toggle`
    - **Bottom left ☀+** → `brightness_up_click`
    - **Bottom right ☼−** → `brightness_down_click`

    Open the advanced sections for optional hold/release actions.
    All buttons are independently configurable; unused actions are
    ignored. No helpers are required.

    **Important:** The mapping above follows the printed symbols.
    Check the `event_type` attribute of your remote's
    `event.*_action` entity to verify the actual physical mapping
    on your particular 3D-printed conversion.

    > The center button can emit both `toggle` and `toggle_hold`
    > during one long press. Hold actions fire once per event and
    > are not continuous brightness loops.

    [FUGA conversion](https://www.printables.com/model/93848-zigbee-til-danske-kontakter)
    · [Supported Zigbee2MQTT actions](https://www.zigbee2mqtt.io/devices/E1524_E1810.html)
  author: "mrmultifunk"
  domain: automation
  homeassistant:
    min_version: "2024.6.0"

  input:
    remote:
      name: "Remote"
      icon: mdi:remote
      input:
        remote_event:
          name: "Zigbee2MQTT remote event entity"
          description: "Select the event entity ending in `_action`, e.g. `event.lea_fjernbetjening_1_vaeg_action`."
          selector:
            entity:
              filter:
                - domain: event

    top_row:
      name: "1 · TOP — Arrow keys (◀ ▶)"
      icon: mdi:arrow-left-right
      description: "Left and right halves of the upper rocker."
      input:
        arrow_left_click_action:
          name: "TOP LEFT · ◀ Arrow"
          description: "Zigbee2MQTT event: `arrow_left_click`. Leave empty to ignore."
          default: []
          selector:
            action: {}

        arrow_right_click_action:
          name: "TOP RIGHT · ▶ Arrow"
          description: "Zigbee2MQTT event: `arrow_right_click`. Leave empty to ignore."
          default: []
          selector:
            action: {}
 
    middle_row:
      name: "2 · MIDDLE — Power (⏻)"
      icon: mdi:power
      description: "Single wide button in the middle."
      input:
        center_click_action:
          name: "MIDDLE · ⏻ Power"
          description: "Zigbee2MQTT event: `toggle`. Leave empty to ignore."
          default: []
          selector:
            action: {}
 
    bottom_row:
      name: "3 · BOTTOM — Brightness (☀+ / ☼−)"
      icon: mdi:brightness-6
      description: "Large sun on the left, small sun on the right."
      input:
        brightness_up_click_action:
          name: "BOTTOM LEFT · ☀+ Brighter"
          description: "Zigbee2MQTT event: `brightness_up_click`. Leave empty to ignore."
          default: []
          selector:
            action: {}

        brightness_down_click_action:
          name: "BOTTOM RIGHT · ☼− Dimmer"
          description: "Zigbee2MQTT event: `brightness_down_click`. Leave empty to ignore."
          default: []
          selector:
            action: {}
 
    hold_actions:
      name: "Advanced · Long presses (optional)"
      icon: mdi:gesture-tap-hold
      description: "Runs once when the hold event arrives."
      collapsed: true
      input:
        arrow_left_hold_action:
          name: "TOP LEFT · ◀ Hold"
          description: "Zigbee2MQTT event: `arrow_left_hold`. Leave empty to ignore."
          default: []
          selector:
            action: {}

        arrow_right_hold_action:
          name: "TOP RIGHT · ▶ Hold"
          description: "Zigbee2MQTT event: `arrow_right_hold`. Leave empty to ignore."
          default: []
          selector:
            action: {}

        center_hold_action:
          name: "MIDDLE · ⏻ Hold"
          description: "Zigbee2MQTT event: `toggle_hold`. Leave empty to ignore."
          default: []
          selector:
            action: {}

        brightness_up_hold_action:
          name: "BOTTOM LEFT · ☀+ Hold"
          description: "Zigbee2MQTT event: `brightness_up_hold`. Leave empty to ignore."
          default: []
          selector:
            action: {}

        brightness_down_hold_action:
          name: "BOTTOM RIGHT · ☼− Hold"
          description: "Zigbee2MQTT event: `brightness_down_hold`. Leave empty to ignore."
          default: []
          selector:
            action: {}
 
    release_actions:
      name: "Advanced · Releases (optional)"
      icon: mdi:gesture-tap-button
      description: "Actions when a held arrow or brightness button is released."
      collapsed: true
      input:
        arrow_left_release_action:
          name: "TOP LEFT · ◀ Release"
          description: "Zigbee2MQTT event: `arrow_left_release`. Leave empty to ignore."
          default: []
          selector:
            action: {}

        arrow_right_release_action:
          name: "TOP RIGHT · ▶ Release"
          description: "Zigbee2MQTT event: `arrow_right_release`. Leave empty to ignore."
          default: []
          selector:
            action: {}

        brightness_up_release_action:
          name: "BOTTOM LEFT · ☀+ Release"
          description: "Zigbee2MQTT event: `brightness_up_release`. Leave empty to ignore."
          default: []
          selector:
            action: {}

        brightness_down_release_action:
          name: "BOTTOM RIGHT · ☼− Release"
          description: "Zigbee2MQTT event: `brightness_down_release`. Leave empty to ignore."
          default: []
          selector:
            action: {}

mode: queued
max: 20
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input remote_event

conditions:
  # Ignore attribute-only updates and unavailable transitions.
  - condition: template
    value_template: >
      {{ trigger.to_state is not none
         and (trigger.from_state is none or
              trigger.to_state.state != trigger.from_state.state) }}

actions:
  - variables:
      blueprint_version: "1.1.0"
      button_event: "{{ trigger.to_state.attributes.get('event_type', '') if trigger.to_state else '' }}"

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'toggle' }}"
        sequence: !input center_click_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'brightness_up_click' }}"
        sequence: !input brightness_up_click_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'brightness_down_click' }}"
        sequence: !input brightness_down_click_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'arrow_left_click' }}"
        sequence: !input arrow_left_click_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'arrow_right_click' }}"
        sequence: !input arrow_right_click_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'toggle_hold' }}"
        sequence: !input center_hold_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'brightness_up_hold' }}"
        sequence: !input brightness_up_hold_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'brightness_down_hold' }}"
        sequence: !input brightness_down_hold_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'arrow_left_hold' }}"
        sequence: !input arrow_left_hold_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'arrow_right_hold' }}"
        sequence: !input arrow_right_hold_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'brightness_up_release' }}"
        sequence: !input brightness_up_release_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'brightness_down_release' }}"
        sequence: !input brightness_down_release_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'arrow_left_release' }}"
        sequence: !input arrow_left_release_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'arrow_right_release' }}"
        sequence: !input arrow_right_release_action
