# IKEA TRÅDFRI E1524/E1810 Zigbee2MQTT event-based 5-button remote
# FUGA wall switch physical button mapping (as pictured).
# Version: 1.2.0
blueprint:
  name: "IKEA TRÅDFRI 5-button – FUGA layout (Z2M) v1.2.0"
  description: |-
    **IKEA TRÅDFRI 5-button / FUGA** · **v1.2.0**

    Assign actions by **physical button position** on the FUGA switch.
    Choose which position the small mechanical selector is set to.

    ### Selector position

    | Button | Left | **Middle (default)** | Right |
    | --- | --- | --- | --- |
    | Top left | ⏻ Power | ◀ Left | ⏻ Power |
    | Top right | ▶ Right | ▶ Right | ▶ Right |
    | Middle | ◀ Left | ⏻ Power | 🔗 Link/pair |
    | Bottom left | ☀ Brighter | ☀ Brighter | ☀ Brighter |
    | Bottom right | ☼ Dimmer | ☼ Dimmer | ☼ Dimmer |

    The selected position remaps Zigbee2MQTT events automatically,
    including relevant hold/release events. **Your button actions
    stay attached to the physical locations**, not to event names.

    ### Notes

    - **Middle** matches the previous blueprint and is the default.
    - **Left** swaps the Top Left and Middle functions.
    - **Right** puts Power at Top Left; the center 🔗 button is
      intended for hardware pairing and normally emits no
      Zigbee2MQTT action that an automation can configure.
    - All five short-press action inputs stay compatible with v1.1.0.
      The new optional Middle Release action is only used in Left mode.
    - Hold/release actions are in the collapsed advanced sections.
      The toggle button can emit both `toggle` and `toggle_hold`.

    **Verify your conversion:** The three layouts are interpreted from
    the symbols on the supplied image. Check each button's `event_type`
    in Home Assistant before relying on the mapping.

    [Printables FUGA conversion](https://www.printables.com/model/93848-zigbee-til-danske-kontakter)
    · [Zigbee2MQTT E1524/E1810 actions](https://www.zigbee2mqtt.io/devices/E1524_E1810.html)
  author: "mrmultifunk"
  domain: automation
  homeassistant:
    min_version: "2024.6.0"

  input:
    remote:
      name: "Remote"
      icon: mdi:remote
      input:
        remote_event:
          name: "Zigbee2MQTT remote event entity"
          description: "Select the event entity ending in `_action`, e.g. `event.lea_fjernbetjening_1_vaeg_action`."
          selector:
            entity:
              filter:
                - domain: event

        switch_position:
          name: "FUGA selector position"
          description: >
            Match the small physical slide switch on the FUGA conversion.
            Middle is the default and uses the original mapping.
          default: middle
          selector:
            select:
              mode: dropdown
              options:
                - label: "Left – Power top left, Left arrow in middle"
                  value: left
                - label: "Middle (default) – Left arrow top left, Power in middle"
                  value: middle
                - label: "Right – Power top left, Link/pair in middle"
                  value: right

    top_row:
      name: "1 · TOP — Left and right buttons"
      icon: mdi:arrow-left-right
      description: "Physical upper-left and upper-right buttons; the symbols depend on selector position."
      input:
        arrow_left_click_action:
          name: "TOP LEFT · Button"
          description: "Left arrow in Middle mode; Power in Left/Right mode. Leave empty to ignore."
          default: []
          selector:
            action: {}

        arrow_right_click_action:
          name: "TOP RIGHT · ▶ Arrow"
          description: "Zigbee2MQTT event: `arrow_right_click`. Leave empty to ignore."
          default: []
          selector:
            action: {}
 
    middle_row:
      name: "2 · MIDDLE — Center button"
      icon: mdi:power
      description: "Power in Middle mode; Left arrow in Left mode; pairing/link button in Right mode."
      input:
        center_click_action:
          name: "MIDDLE · Button"
          description: "Power in Middle mode; Left arrow in Left mode. Not programmable in Right mode."
          default: []
          selector:
            action: {}
 
    bottom_row:
      name: "3 · BOTTOM — Brightness (☀+ / ☼−)"
      icon: mdi:brightness-6
      description: "Large sun on the left, small sun on the right."
      input:
        brightness_up_click_action:
          name: "BOTTOM LEFT · ☀+ Brighter"
          description: "Zigbee2MQTT event: `brightness_up_click`. Leave empty to ignore."
          default: []
          selector:
            action: {}

        brightness_down_click_action:
          name: "BOTTOM RIGHT · ☼− Dimmer"
          description: "Zigbee2MQTT event: `brightness_down_click`. Leave empty to ignore."
          default: []
          selector:
            action: {}
 
    hold_actions:
      name: "Advanced · Long presses (optional)"
      icon: mdi:gesture-tap-hold
      description: "Runs once when the hold event arrives."
      collapsed: true
      input:
        arrow_left_hold_action:
          name: "TOP LEFT · Hold"
          description: "Left-arrow hold (Middle mode) or Power hold (Left/Right modes)."
          default: []
          selector:
            action: {}

        arrow_right_hold_action:
          name: "TOP RIGHT · ▶ Hold"
          description: "Zigbee2MQTT event: `arrow_right_hold`. Leave empty to ignore."
          default: []
          selector:
            action: {}

        center_hold_action:
          name: "MIDDLE · Hold"
          description: "Power hold (Middle) or Left-arrow hold (Left). Not available in Right mode."
          default: []
          selector:
            action: {}

        brightness_up_hold_action:
          name: "BOTTOM LEFT · ☀+ Hold"
          description: "Zigbee2MQTT event: `brightness_up_hold`. Leave empty to ignore."
          default: []
          selector:
            action: {}

        brightness_down_hold_action:
          name: "BOTTOM RIGHT · ☼− Hold"
          description: "Zigbee2MQTT event: `brightness_down_hold`. Leave empty to ignore."
          default: []
          selector:
            action: {}
 
    release_actions:
      name: "Advanced · Releases (optional)"
      icon: mdi:gesture-tap-button
      description: "Actions when a held arrow or brightness button is released."
      collapsed: true
      input:
        arrow_left_release_action:
          name: "TOP LEFT · Release"
          description: "Left-arrow release in Middle mode only; Power has no release event."
          default: []
          selector:
            action: {}

        center_release_action:
          name: "MIDDLE · Release (Left selector only)"
          description: "Left-arrow release from the middle button; available only in Left mode."
          default: []
          selector:
            action: {}

        arrow_right_release_action:
          name: "TOP RIGHT · ▶ Release"
          description: "Zigbee2MQTT event: `arrow_right_release`. Leave empty to ignore."
          default: []
          selector:
            action: {}

        brightness_up_release_action:
          name: "BOTTOM LEFT · ☀+ Release"
          description: "Zigbee2MQTT event: `brightness_up_release`. Leave empty to ignore."
          default: []
          selector:
            action: {}

        brightness_down_release_action:
          name: "BOTTOM RIGHT · ☼− Release"
          description: "Zigbee2MQTT event: `brightness_down_release`. Leave empty to ignore."
          default: []
          selector:
            action: {}

variables:
  switch_position: !input switch_position

mode: queued
max: 20
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input remote_event

conditions:
  # Ignore attribute-only updates and unavailable transitions.
  - condition: template
    value_template: >
      {{ trigger.to_state is not none
         and (trigger.from_state is none or
              trigger.to_state.state != trigger.from_state.state) }}

actions:
  - variables:
      blueprint_version: "1.2.0"
      raw_button_event: "{{ trigger.to_state.attributes.get('event_type', '') if trigger.to_state else '' }}"
      # Normalize the hardware event to a logical physical FUGA position.
      # Existing action input keys retain their meanings in Middle mode.
      # Right-center is the physical link/pairing button (no action event).
      button_event: >-
        {% set ev = trigger.to_state.attributes.get('event_type', '') if trigger.to_state else '' -%}
        {% set left_map = {
          'toggle': 'arrow_left_click',
          'toggle_hold': 'arrow_left_hold',
          'arrow_left_click': 'toggle',
          'arrow_left_hold': 'toggle_hold',
          'arrow_left_release': 'middle_release'
        } -%}
        {% set right_map = {
          'toggle': 'arrow_left_click',
          'toggle_hold': 'arrow_left_hold',
          'arrow_left_click': '',
          'arrow_left_hold': '',
          'arrow_left_release': ''
        } -%}
        {{ left_map.get(ev, ev) if switch_position == 'left'
           else right_map.get(ev, ev) if switch_position == 'right'
           else ev }}

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'toggle' }}"
        sequence: !input center_click_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'brightness_up_click' }}"
        sequence: !input brightness_up_click_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'brightness_down_click' }}"
        sequence: !input brightness_down_click_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'arrow_left_click' }}"
        sequence: !input arrow_left_click_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'arrow_right_click' }}"
        sequence: !input arrow_right_click_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'toggle_hold' }}"
        sequence: !input center_hold_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'brightness_up_hold' }}"
        sequence: !input brightness_up_hold_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'brightness_down_hold' }}"
        sequence: !input brightness_down_hold_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'arrow_left_hold' }}"
        sequence: !input arrow_left_hold_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'arrow_right_hold' }}"
        sequence: !input arrow_right_hold_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'brightness_up_release' }}"
        sequence: !input brightness_up_release_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'brightness_down_release' }}"
        sequence: !input brightness_down_release_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'arrow_left_release' }}"
        sequence: !input arrow_left_release_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'middle_release' }}"
        sequence: !input center_release_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'arrow_right_release' }}"
        sequence: !input arrow_right_release_action
