variables:
  switch_position: !input switch_position
  z2m_dimming_remote: !input remote_event
  z2m_dimming_enabled: !input z2m_dimming_enabled
  z2m_dimming_debug_topics: !input z2m_dimming_debug_topics
  z2m_dimming_top_left_mode: !input z2m_dimming_top_left_mode
  z2m_dimming_top_right_mode: !input z2m_dimming_top_right_mode
  z2m_dimming_center_mode: !input z2m_dimming_center_mode
  z2m_dimming_bottom_left_mode: !input z2m_dimming_bottom_left_mode
  z2m_dimming_bottom_right_mode: !input z2m_dimming_bottom_right_mode
  z2m_dimming_top_left_lights: !input z2m_dimming_top_left_lights
  z2m_dimming_top_left_topics: !input z2m_dimming_top_left_topics
  z2m_dimming_top_right_lights: !input z2m_dimming_top_right_lights
  z2m_dimming_top_right_topics: !input z2m_dimming_top_right_topics
  z2m_dimming_center_lights: !input z2m_dimming_center_lights
  z2m_dimming_center_topics: !input z2m_dimming_center_topics
  z2m_dimming_bottom_left_lights: !input z2m_dimming_bottom_left_lights
  z2m_dimming_bottom_left_topics: !input z2m_dimming_bottom_left_topics
  z2m_dimming_bottom_right_lights: !input z2m_dimming_bottom_right_lights
  z2m_dimming_bottom_right_topics: !input z2m_dimming_bottom_right_topics
  z2m_dimming_base_topic: !input z2m_dimming_base_topic
  z2m_dimming_speed: !input z2m_dimming_speed
  z2m_dimming_timeout: !input z2m_dimming_timeout

# Watchdog waits must not block subsequent release actions.
mode: parallel
max: 30
max_exceeded: silent

triggers:
  # Zigbee2MQTT event entities update their timestamp for each new event.
  # An explicit null 'to' follows the recommended HA event-entity pattern.
  - trigger: state
    entity_id: !input remote_event
    to: ~

conditions:
  # Only process state changes which contain an actual button event.
  - condition: template
    value_template: >
      {{ trigger.to_state is not none and
         trigger.to_state.attributes.get('event_type', '') != '' }}

actions:
  - variables:
      blueprint_version: "1.11.0"
      raw_button_event: "{{ trigger.to_state.attributes.get('event_type', '') if trigger.to_state else '' }}"
      # Normalize the hardware event to a logical physical FUGA position.
      # Existing action input keys retain their meanings in Middle mode.
      # Right-center is the physical link/pairing button (no action event).
      button_event: >-
        {% set ev = trigger.to_state.attributes.get('event_type', '') if trigger.to_state else '' -%}
        {% set left_map = {
          'toggle': 'arrow_left_click',
          'toggle_hold': 'arrow_left_hold',
          'arrow_left_click': 'toggle',
          'arrow_left_hold': 'toggle_hold',
          'arrow_left_release': 'middle_release'
        } -%}
        {% set right_map = {
          'toggle': 'arrow_left_click',
          'toggle_hold': 'arrow_left_hold',
          'arrow_left_click': '',
          'arrow_left_hold': '',
          'arrow_left_release': ''
        } -%}
        {{ left_map.get(ev, ev) if switch_position == 'left'
           else right_map.get(ev, ev) if switch_position == 'right'
           else ev }}


  # Map normalized hardware events to physical buttons. Continuous dimming
  # only starts on keys for which the remote publishes a matching release.
  - variables:
      z2m_dimming_button_key: >-
        {% set ev = button_event | trim -%}
        {% set keys = {
          'arrow_left_hold': 'top_left' if switch_position == 'middle' else '',
          'arrow_left_release': 'top_left' if switch_position == 'middle' else '',
          'arrow_right_hold': 'top_right',
          'arrow_right_release': 'top_right',
          'toggle_hold': 'center' if switch_position == 'left' else '',
          'middle_release': 'center' if switch_position == 'left' else '',
          'brightness_up_hold': 'bottom_left',
          'brightness_up_release': 'bottom_left',
          'brightness_down_hold': 'bottom_right',
          'brightness_down_release': 'bottom_right'
        } -%}
        {{ keys.get(ev, '') }}
  - variables:
      z2m_dimming_button_mode: >-
        {% set modes = {
          'top_left': z2m_dimming_top_left_mode,
          'top_right': z2m_dimming_top_right_mode,
          'center': z2m_dimming_center_mode,
          'bottom_left': z2m_dimming_bottom_left_mode,
          'bottom_right': z2m_dimming_bottom_right_mode
        } -%}
        {{ modes.get(z2m_dimming_button_key | trim, 'custom') }}
      z2m_dimming_release_raw: >-
        {% set releases = {
          'top_left': 'arrow_left_release',
          'top_right': 'arrow_right_release',
          'center': 'arrow_left_release',
          'bottom_left': 'brightness_up_release',
          'bottom_right': 'brightness_down_release'
        } -%}
        {{ releases.get(z2m_dimming_button_key | trim, '') }}

  # Resolve topics exclusively from the selected physical button.
  # A button without selected targets does not publish MQTT messages.
  - variables:
      z2m_dimming_topics: >-
        {% set key = z2m_dimming_button_key | trim -%}
        {% set config = {
          'top_left': {'lights': z2m_dimming_top_left_lights, 'topics': z2m_dimming_top_left_topics},
          'top_right': {'lights': z2m_dimming_top_right_lights, 'topics': z2m_dimming_top_right_topics},
          'center': {'lights': z2m_dimming_center_lights, 'topics': z2m_dimming_center_topics},
          'bottom_left': {'lights': z2m_dimming_bottom_left_lights, 'topics': z2m_dimming_bottom_left_topics},
          'bottom_right': {'lights': z2m_dimming_bottom_right_lights, 'topics': z2m_dimming_bottom_right_topics}
        } -%}
        {% set own = config.get(key, {'lights': [], 'topics': ''}) -%}
        {% set selected_lights = own.lights | default([], true) -%}
        {% set selected_text = own.topics | default('', true) -%}
        {% set ns = namespace(names=[], topics=[]) -%}
          {% set base = z2m_dimming_base_topic | trim | trim('/') -%}
          {% for entity_id in selected_lights -%}
            {% if entity_id.startswith('light.') -%}
              {% set ns.names = ns.names + [entity_id.split('.', 1)[1]] -%}
            {% endif -%}
          {% endfor -%}
          {% for line in selected_text.splitlines() -%}
            {% set name = line | trim -%}
            {% if name != '' and not name.startswith('#') -%}
              {% set ns.names = ns.names + [name] -%}
            {% endif -%}
          {% endfor -%}
          {% for name in ns.names -%}
            {% if name.endswith('/set') and '/' in name -%}
              {% set topic = name -%}
            {% elif base != '' -%}
              {% set topic = base ~ '/' ~ name ~ '/set' -%}
            {% else -%}
              {% set topic = '' -%}
            {% endif -%}
            {% if topic != '' and topic not in ns.topics -%}
              {% set ns.topics = ns.topics + [topic] -%}
            {% endif -%}
          {% endfor -%}
          {{ ns.topics }}

  # Diagnose: what was inferred from entity IDs, independent of manual
  # overrides. The actual published topics are in z2m_dimming_topics.
  - variables:
      z2m_dimming_guessed_topics: >-
        {% set key = z2m_dimming_button_key | trim -%}
        {% set selected = {
          'top_left': z2m_dimming_top_left_lights,
          'top_right': z2m_dimming_top_right_lights,
          'center': z2m_dimming_center_lights,
          'bottom_left': z2m_dimming_bottom_left_lights,
          'bottom_right': z2m_dimming_bottom_right_lights
        }.get(key, []) -%}

        {% set ns = namespace(topics=[]) -%}
        {% set base = z2m_dimming_base_topic | trim | trim('/') -%}
        {% for ent in selected -%}
          {% if ent.startswith('light.') and base != '' -%}
            {% set topic = base ~ '/' ~ ent.split('.', 1)[1] ~ '/set' -%}
            {% if topic not in ns.topics -%}
              {% set ns.topics = ns.topics + [topic] -%}
            {% endif -%}
          {% endif -%}
        {% endfor -%}
        {{ ns.topics }}

  # Short presses always retain their existing actions. Only selected
  # hold/release events are replaced by Zigbee2MQTT brightness_move.
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ z2m_dimming_enabled and
                 z2m_dimming_button_key | trim != '' and
                 z2m_dimming_button_mode | trim in ['up', 'down'] and
                 (button_event.endswith('_hold') or
                  button_event.endswith('_release')) }}
        sequence:
          - if:
              - condition: template
                value_template: "{{ z2m_dimming_topics | count == 0 }}"
            then:
              - stop: >-
                  Zigbee2MQTT-dæmpning er aktiv, men ingen MQTT-topics blev
                  fundet for denne knap. Vælg lysentiteter eller angiv
                  friendly names/fulde topics under knappens sektion,
                  under den pågældende knap.
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ button_event.endswith('_hold') }}"
                sequence:
                  - variables:
                      z2m_dimming_direction: >-
                        {{ 1 if z2m_dimming_button_mode | trim == 'up' else -1 }}
                  - if:
                      - condition: template
                        value_template: "{{ z2m_dimming_debug_topics }}"
                    then:
                      - action: persistent_notification.create
                        data:
                          notification_id: "fuga_z2m_topics_{{ z2m_dimming_remote | replace('.', '_') }}"
                          title: "FUGA · Zigbee2MQTT topic-diagnose"
                          message: >-
                            **Knap:** {{ z2m_dimming_button_key | trim }}

                            **Retning:** {{ 'Øg lysstyrken' if z2m_dimming_direction | int > 0 else 'Sænk lysstyrken' }}

                            **Gættet ud fra entitets-ID:**
                            {{ z2m_dimming_guessed_topics | join(', ') if z2m_dimming_guessed_topics | count > 0 else 'Intet automatisk gæt (kun manuel indtastning).' }}

                            **Faktisk anvendte MQTT-topics:**
                            {{ z2m_dimming_topics | join(', ') }}

                            Gæt er ikke en bekræftelse af Zigbee2MQTT friendly name.
                  - repeat:
                      for_each: "{{ z2m_dimming_topics }}"
                      sequence:
                        - action: mqtt.publish
                          data:
                            topic: "{{ repeat.item }}"
                            payload: >-
                              {{ {'brightness_move': (z2m_dimming_direction | int) *
                                 (z2m_dimming_speed | int)} | to_json }}
                            retain: false
                  # Wait for this physical button's raw release, or another
                  # selected dimming hold. Do not stop a new movement when
                  # the previous button's wait ends due to a different hold.
                  - wait_template: >-
                      {% set ev = state_attr(z2m_dimming_remote, 'event_type') | default('', true) -%}
                      {% set active_holds = [
                        'arrow_left_hold' if
                          ((switch_position == 'middle' and z2m_dimming_top_left_mode != 'custom')
                          or (switch_position == 'left' and z2m_dimming_center_mode != 'custom'))
                          else '',
                        'arrow_right_hold' if z2m_dimming_top_right_mode != 'custom' else '',
                        'brightness_up_hold' if z2m_dimming_bottom_left_mode != 'custom' else '',
                        'brightness_down_hold' if z2m_dimming_bottom_right_mode != 'custom' else ''
                      ] -%}
                      {{ ev == z2m_dimming_release_raw | trim or
                         (ev != raw_button_event and ev in active_holds) }}
                    timeout:
                      seconds: "{{ z2m_dimming_timeout | int(15) }}"
                    continue_on_timeout: true
                  - if:
                      - condition: template
                        value_template: "{{ not wait.completed }}"
                    then:
                      - repeat:
                          for_each: "{{ z2m_dimming_topics }}"
                          sequence:
                            - action: mqtt.publish
                              data:
                                topic: "{{ repeat.item }}"
                                payload: '{"brightness_move": 0}'
                                retain: false

              # Release is a separate parallel run to stop immediately.
              - conditions:
                  - condition: template
                    value_template: "{{ button_event.endswith('_release') }}"
                sequence:
                  - repeat:
                      for_each: "{{ z2m_dimming_topics }}"
                      sequence:
                        - action: mqtt.publish
                          data:
                            topic: "{{ repeat.item }}"
                            payload: '{"brightness_move": 0}'
                            retain: false
          - stop: "Zigbee2MQTT-dæmpningshændelsen er behandlet."

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'toggle' }}"
        sequence: !input center_click_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'brightness_up_click' }}"
        sequence: !input brightness_up_click_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'brightness_down_click' }}"
        sequence: !input brightness_down_click_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'arrow_left_click' }}"
        sequence: !input arrow_left_click_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'arrow_right_click' }}"
        sequence: !input arrow_right_click_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'toggle_hold' }}"
        sequence: !input center_hold_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'brightness_up_hold' }}"
        sequence: !input brightness_up_hold_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'brightness_down_hold' }}"
        sequence: !input brightness_down_hold_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'arrow_left_hold' }}"
        sequence: !input arrow_left_hold_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'arrow_right_hold' }}"
        sequence: !input arrow_right_hold_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'brightness_up_release' }}"
        sequence: !input brightness_up_release_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'brightness_down_release' }}"
        sequence: !input brightness_down_release_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'arrow_left_release' }}"
        sequence: !input arrow_left_release_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'middle_release' }}"
        sequence: !input center_release_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'arrow_right_release' }}"
        sequence: !input arrow_right_release_action
    default:
      - stop: "Ingen understøttet knaphændelse. Kontrollér valgt MQTT-event-entitet og omskifterposition. Se raw_button_event og button_event i sporingen."
