            entity:
              multiple: true
              filter:
                - domain: light
                  integration: mqtt

        z2m_dimming_center_topics:
          name: "Manuelle MQTT-topics (valgfrit)"
          description: >-
            Valgfrit. Skriv Zigbee2MQTT friendly name eller fuldt MQTT-topic,
