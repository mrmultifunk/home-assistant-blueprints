# IKEA TRÅDFRI E1524/E1810 – FUGA-konvertering til Zigbee2MQTT
# Version: 1.5.0
blueprint:
  name: "IKEA TRÅDFRI – FUGA-fjernbetjening (Zigbee2MQTT) v1.5.0"
  description: |-
    **IKEA TRÅDFRI · FUGA-fjernbetjening · v1.5.0**

    Vælg selv, hvad hver knap på din FUGA-kontakt skal gøre. Blueprintet understøtter **alle tre positioner** på den lille mekaniske omskifter. **Midten er standard.**

    ### Knapper – omskifter i midten (standard)

    ```text
    ┌─────────────┬─────────────┐
    │  ◀ VENSTRE  │  HØJRE ▶    │
    ├─────────────┴─────────────┤
    │       ⏻ TÆND/SLUK        │
    ├─────────────┬─────────────┤
    │  ☀ LYSERE   │  MØRKERE ☼  │
    └─────────────┴─────────────┘
    ```

    ### De andre omskifterpositioner

    - **Venstre:** Øverst venstre er **tænd/sluk**. Midterknappen er **venstre pil**. De øvrige knapper er uændrede.
    - **Højre:** Øverst venstre er **tænd/sluk**. Midterknappen er **link/parring** og kan normalt ikke bruges til en automation. De øvrige knapper er uændrede.

    Handlingerne er knyttet til **knappernes fysiske placering**. Blueprintet tilpasser Zigbee2MQTT-hændelserne efter den valgte omskifterposition. Du kan tilføje korte og lange tryk samt slip-handlinger. Ubrugte handlinger kan stå tomme.

    > **Bemærk:** Omskifterens position skal vælges manuelt. Kontroller gerne hver knaps `event_type` i Home Assistant, da den mekaniske mapping er udledt af FUGA-frontens symboler.

    **Husk at tildele handlinger:** Knapperne har ingen standardhandling. Vælg f.eks. *Lys → Skift (toggle)* under den ønskede knap. Handlinger fra en tidligere automation overføres ikke automatisk.

    **Fejlfinding:** Fjernbetjeningsvælgeren viser kun MQTT-event-entiteter. Ukendte knaphændelser får en forklaring i automationssporingen (`raw_button_event` og `button_event`).

    ### Valgfri Zigbee2MQTT-dæmpning

    Aktivér *Kontinuerlig dæmpning*, og vælg en funktion for **hver fysisk knap**:
    *Brugerdefineret*, *Dæmp op* eller *Dæmp ned*. Flere knapper kan
    tildeles samme retning. Kun lange tryk overtages; korte tryk og øvrige
    brugerdefinerede handlinger bevares. Slip giver `brightness_move: 0`,
    og en sikkerheds-timeout stopper, hvis slip mangler.

    **Begrænsning på TRÅDFRI E1524/E1810:**
    - **Øverst venstre** kan dæmpe kontinuerligt, når omskifteren står
      i **midten** (venstre pil).
    - **Midterknappen** kan dæmpe kontinuerligt, når omskifteren står
      til **venstre** (venstre pil).
    - **Øverst højre** og begge **nederste knapper** kan dæmpe i alle
      positioner.
    - Tænd/sluk-knappen udsender ikke slip-hændelse; derfor kan
      den ikke bruges til kontinuerlig dæmpning. Den højre
      omskifterposition har desuden link/parring i midten.

    Hvis en knap vælges i en position, der ikke udsender slip, falder
    den tilbage på sin eksisterende brugerdefinerede hold-handling.
    Vælg et primært lys som tidligere, og tilføj **flere MQTT-lys** eller
    **flere friendly names/fulde MQTT-command-topics** (én pr. linje).
    Hold, slip og timeout sender samme kommando til samtlige mål.
    Dobbelte topics bliver fjernet. Det eksisterende enkeltmåls-input
    og eventuel manuel override bevares for bagudkompatibilitet.

    En Zigbee2MQTT-gruppe kan også angives som friendly name og er mere
    effektiv, når flere Zigbee-enheder altid skal dæmpes sammen.
    Lysentiteter bruges kun til best-effort afledning af friendly name;
    Home Assistant eksponerer ikke MQTT command_topic direkte.
    MQTT-meddelelser sendes uden retain.

    **Parallelle kørsler:** Dette blueprint anvender `mode: parallel` for at
    reagere øjeblikkeligt på slip-hændelser, mens en timeout venter. Egendefinerede
    handlinger kan derfor også køre samtidigt (tidligere var tilstanden `queued`).

    [FUGA-modellen på Printables](https://www.printables.com/model/93848-zigbee-til-danske-kontakter) · [Zigbee2MQTT – understøttede hændelser](https://www.zigbee2mqtt.io/devices/E1524_E1810.html)
  author: "mrmultifunk"
  domain: automation
  homeassistant:
    min_version: "2024.6.0"

  input:
    remote:
      name: "Fjernbetjening og omskifter"
      icon: mdi:remote
      input:
        remote_event:
          name: "Fjernbetjeningens hændelsesentitet"
          description: "Vælg MQTT-hændelsesentiteten fra Zigbee2MQTT, som slutter på _action. For eksempel event.lea_fjernbetjening_1_vaeg_action."
          selector:
            entity:
              filter:
                - domain: event
                  integration: mqtt

        switch_position:
          name: "Omskifterens position"
          description: "Vælg samme position som den lille fysiske omskifter. Midten er standard."
          default: middle
          selector:
            select:
              mode: dropdown
              options:
                - label: "Venstre – tænd/sluk øverst venstre, venstre pil i midten"
                  value: left
                - label: "Midten (standard) – venstre pil øverst, tænd/sluk i midten"
                  value: middle
                - label: "Højre – tænd/sluk øverst venstre, link/parring i midten"
                  value: right

    top_row:
      name: "1 · Øverst – venstre og højre"
      icon: mdi:arrow-left-right
      description: "De to øverste knapper. Funktionen af øverst venstre afhænger af omskifterens position."
      input:
        arrow_left_click_action:
          name: "ØVERST VENSTRE · Kort tryk"
          description: "Venstre pil i midterposition; tænd/sluk i venstre og højre position."
          default: []
          selector:
            action: {}

        arrow_right_click_action:
          name: "ØVERST HØJRE · ▶ Kort tryk"
          description: "Højre pil i alle tre positioner."
          default: []
          selector:
            action: {}

    middle_row:
      name: "2 · Midten – midterknappen"
      icon: mdi:power
      description: "Tænd/sluk i midterposition, venstre pil i venstre position. Link/parring i højre position."
      input:
        center_click_action:
          name: "MIDTEN · Kort tryk"
          description: "Tænd/sluk i midterposition, venstre pil i venstre position. Ingen programmerbar handling i højre position."
          default: []
          selector:
            action: {}

    bottom_row:
      name: "3 · Nederst – lysstyrke"
      icon: mdi:brightness-6
      description: "Stor sol til venstre (lysere), lille sol til højre (mørkere)."
      input:
        brightness_up_click_action:
          name: "NEDERST VENSTRE · ☀ Lysere"
          description: "Lysstyrke op – kort tryk i alle tre positioner."
          default: []
          selector:
            action: {}

        brightness_down_click_action:
          name: "NEDERST HØJRE · ☼ Mørkere"
          description: "Lysstyrke ned – kort tryk i alle tre positioner."
          default: []
          selector:
            action: {}

    z2m_dimming:
      name: "Zigbee2MQTT · Kontinuerlig dæmpning (valgfrit)"
      icon: mdi:brightness-6
      description: >-
        Vælg individuel funktion for hver fysisk knap: Brugerdefineret,
        Dæmp op eller Dæmp ned. Kun lange tryk og slip overtages.
        Øverst venstre understøtter kun dæmpning i omskifterens midterposition;
        midterknappen kun i venstre position. De øvrige tre knapper
        understøtter alle positioner. Knappen tænd/sluk har ingen slip-hændelse.
        En MQTT-lys-entitet bruges til best-effort navneforslag, ikke
        direkte command_topic-opslag. Manuel friendly name kan overstyre.
        Funktionen er slået fra som standard.
      collapsed: true
      input:
        z2m_dimming_enabled:
          name: "Aktivér kontinuerlig Zigbee2MQTT-dæmpning"
          description: "Når aktiv, erstatter dæmpningen kun hold/slip for knapper, som nedenfor er sat til Dæmp op eller Dæmp ned og har en slip-hændelse."
          default: false
          selector:
            boolean: {}

        z2m_dimming_top_left_mode:
          name: "ØVERST VENSTRE · Langt tryk"
          description: "Kontinuerlig dæmpning virker kun med omskifteren i MIDTEN (venstre pil)."
          default: custom
          selector:
            select:
              mode: dropdown
              options:
                - label: "Brug eksisterende handling"
                  value: custom
                - label: "Dæmp op"
                  value: up
                - label: "Dæmp ned"
                  value: down

        z2m_dimming_top_right_mode:
          name: "ØVERST HØJRE · Langt tryk"
          description: "Virker i alle tre omskifterpositioner."
          default: custom
          selector:
            select:
              mode: dropdown
              options:
                - label: "Brug eksisterende handling"
                  value: custom
                - label: "Dæmp op"
                  value: up
                - label: "Dæmp ned"
                  value: down

        z2m_dimming_center_mode:
          name: "MIDTEN · Langt tryk"
          description: "Kontinuerlig dæmpning virker kun med omskifteren til VENSTRE (venstre pil). Tænd/sluk har ikke en slip-hændelse."
          default: custom
          selector:
            select:
              mode: dropdown
              options:
                - label: "Brug eksisterende handling"
                  value: custom
                - label: "Dæmp op"
                  value: up
                - label: "Dæmp ned"
                  value: down

        z2m_dimming_bottom_left_mode:
          name: "NEDERST VENSTRE · ☀ Langt tryk"
          description: "Virker i alle omskifterpositioner. Standard: Dæmp op."
          default: up
          selector:
            select:
              mode: dropdown
              options:
                - label: "Brug eksisterende handling"
                  value: custom
                - label: "Dæmp op"
                  value: up
                - label: "Dæmp ned"
                  value: down

        z2m_dimming_bottom_right_mode:
          name: "NEDERST HØJRE · ☼ Langt tryk"
          description: "Virker i alle omskifterpositioner. Standard: Dæmp ned."
          default: down
          selector:
            select:
              mode: dropdown
              options:
                - label: "Brug eksisterende handling"
                  value: custom
                - label: "Dæmp op"
                  value: up
                - label: "Dæmp ned"
                  value: down

        z2m_dimming_light:
          name: "Primær lysentitet (eksisterende mål)"
          description: >-
            Behold den tidligere valgte MQTT-lys- eller gruppeentitet her.
            Navnet bruges som Zigbee2MQTT friendly name, hvis det passer.
            Alle ekstra valgte lys nedenfor styres også.
          default: ""
          selector:
            entity:
              filter:
                - domain: light
                  integration: mqtt

        z2m_dimming_extra_lights:
          name: "Yderligere lysentiteter (vælg flere)"
          description: >-
            Tilføj flere MQTT-lys eller Zigbee2MQTT-gruppeentiteter.
            Alle valgte lys modtager samme brightness_move.
            Friendly name forsøges udledt af enhedens navn i Home Assistant.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: light
                  integration: mqtt

        z2m_dimming_name_override:
          name: "Primært friendly name (manuel override)"
          description: >-
            Som før: overstyrer den primære lysentitets friendly name, eller
            bruges alene som primært mål. Yderligere mål tilføjes nedenfor.
            Skriv kun friendly name, ikke 'zigbee2mqtt/' eller '/set'.
          default: ""
          selector:
            text: {}

        z2m_dimming_extra_topics:
          name: "Yderligere friendly names eller MQTT-topics (én pr. linje)"
          description: >-
            Eksempel: stue_spots (friendly name), koekkenspots eller
            zigbee2mqtt/alrum_lys/set (fuldt topic). Grupper kan også
            angives med deres friendly name. Én pr. linje, ingen kommaer.
            Tomme linjer og linjer, der starter med #, ignoreres.
          default: ""
          selector:
            text:
              multiline: true

        z2m_dimming_base_topic:
          name: "Zigbee2MQTT base topic"
          description: "Normalt zigbee2mqtt. Ret hvis du har ændret base_topic i Zigbee2MQTT."
          default: zigbee2mqtt
          selector:
            text: {}

        z2m_dimming_speed:
          name: "Dæmpningshastighed (enheder/sekund)"
          default: 40
          selector:
            number:
              min: 10
              max: 150
              step: 5
              mode: slider

        z2m_dimming_timeout:
          name: "Sikkerheds-timeout (sekunder)"
          description: >-
            Stopper automatisk ved manglende slip-hændelse. Standard 15 sekunder.
            Vælg en værdi længere end et normalt langt tryk.
          default: 15
          selector:
            number:
              min: 5
              max: 60
              step: 1
              mode: slider

    hold_actions:
      name: "Avanceret · Lange tryk (valgfrit)"
      icon: mdi:gesture-tap-hold
      description: "Handlingen køres én gang, når et langt tryk registreres."
      collapsed: true
      input:
        arrow_left_hold_action:
          name: "ØVERST VENSTRE · Langt tryk"
          description: "Venstre pil i midterposition; tænd/sluk i venstre og højre position."
          default: []
          selector:
            action: {}

        arrow_right_hold_action:
          name: "ØVERST HØJRE · ▶ Langt tryk"
          description: "Langt tryk på højre pil."
          default: []
          selector:
            action: {}

        center_hold_action:
          name: "MIDTEN · Langt tryk"
          description: "Tænd/sluk i midterposition; venstre pil i venstre position. Ikke tilgængelig i højre position."
          default: []
          selector:
            action: {}

        brightness_up_hold_action:
          name: "NEDERST VENSTRE · ☀ Langt tryk"
          description: "Langt tryk på lysstyrke op."
          default: []
          selector:
            action: {}

        brightness_down_hold_action:
          name: "NEDERST HØJRE · ☼ Langt tryk"
          description: "Langt tryk på lysstyrke ned."
          default: []
          selector:
            action: {}

    release_actions:
      name: "Avanceret · Slip knap (valgfrit)"
      icon: mdi:gesture-tap-button
      description: "Kører når en knap slippes efter et langt tryk, hvis Zigbee2MQTT udsender en slip-hændelse."
      collapsed: true
      input:
        arrow_left_release_action:
          name: "ØVERST VENSTRE · Slip"
          description: "Slip venstre pil i midterposition; tænd/sluk har normalt ingen slip-hændelse."
          default: []
          selector:
            action: {}

        center_release_action:
          name: "MIDTEN · Slip (kun venstre position)"
          description: "Slip venstre pil på midterknappen, når omskifteren står til venstre."
          default: []
          selector:
            action: {}

        arrow_right_release_action:
          name: "ØVERST HØJRE · ▶ Slip"
          description: "Slip højre pil."
          default: []
          selector:
            action: {}

        brightness_up_release_action:
          name: "NEDERST VENSTRE · ☀ Slip"
          description: "Slip lysstyrke op."
          default: []
          selector:
            action: {}

        brightness_down_release_action:
          name: "NEDERST HØJRE · ☼ Slip"
          description: "Slip lysstyrke ned."
          default: []
          selector:
            action: {}

variables:
  switch_position: !input switch_position
  z2m_dimming_remote: !input remote_event
  z2m_dimming_enabled: !input z2m_dimming_enabled
  z2m_dimming_top_left_mode: !input z2m_dimming_top_left_mode
  z2m_dimming_top_right_mode: !input z2m_dimming_top_right_mode
  z2m_dimming_center_mode: !input z2m_dimming_center_mode
  z2m_dimming_bottom_left_mode: !input z2m_dimming_bottom_left_mode
  z2m_dimming_bottom_right_mode: !input z2m_dimming_bottom_right_mode
  z2m_dimming_light: !input z2m_dimming_light
  z2m_dimming_extra_lights: !input z2m_dimming_extra_lights
  z2m_dimming_name_override: !input z2m_dimming_name_override
  z2m_dimming_extra_topics: !input z2m_dimming_extra_topics
  z2m_dimming_base_topic: !input z2m_dimming_base_topic
  z2m_dimming_speed: !input z2m_dimming_speed
  z2m_dimming_timeout: !input z2m_dimming_timeout

# Watchdog waits must not block subsequent release actions.
mode: parallel
max: 30
max_exceeded: silent

triggers:
  # Zigbee2MQTT event entities update their timestamp for each new event.
  # An explicit null 'to' follows the recommended HA event-entity pattern.
  - trigger: state
    entity_id: !input remote_event
    to: ~

conditions:
  # Only process state changes which contain an actual button event.
  - condition: template
    value_template: >
      {{ trigger.to_state is not none and
         trigger.to_state.attributes.get('event_type', '') != '' }}

actions:
  - variables:
      blueprint_version: "1.5.0"
      raw_button_event: "{{ trigger.to_state.attributes.get('event_type', '') if trigger.to_state else '' }}"
      # Normalize the hardware event to a logical physical FUGA position.
      # Existing action input keys retain their meanings in Middle mode.
      # Right-center is the physical link/pairing button (no action event).
      button_event: >-
        {% set ev = trigger.to_state.attributes.get('event_type', '') if trigger.to_state else '' -%}
        {% set left_map = {
          'toggle': 'arrow_left_click',
          'toggle_hold': 'arrow_left_hold',
          'arrow_left_click': 'toggle',
          'arrow_left_hold': 'toggle_hold',
          'arrow_left_release': 'middle_release'
        } -%}
        {% set right_map = {
          'toggle': 'arrow_left_click',
          'toggle_hold': 'arrow_left_hold',
          'arrow_left_click': '',
          'arrow_left_hold': '',
          'arrow_left_release': ''
        } -%}
        {{ left_map.get(ev, ev) if switch_position == 'left'
           else right_map.get(ev, ev) if switch_position == 'right'
           else ev }}


  # Build unique MQTT command topics from legacy inputs, multiple MQTT
  # light entities, and explicit names/topics (also supports group names).
  # HA doesn't expose the exact discovered command_topic to templates.
  - variables:
      z2m_dimming_topics: >-
        {% set base = z2m_dimming_base_topic | trim | trim('/') -%}
        {% set ns = namespace(names=[], topics=[]) -%}
        {% set primary = z2m_dimming_name_override | trim -%}
        {% if primary == '' and z2m_dimming_light | trim != '' -%}
          {% set primary = device_attr(z2m_dimming_light, 'name') | default('', true) | trim -%}
        {% endif -%}
        {% if primary != '' -%}
          {% set ns.names = ns.names + [primary] -%}
        {% endif -%}
        {% if z2m_dimming_extra_lights is sequence and z2m_dimming_extra_lights is not string -%}
          {% for ent in z2m_dimming_extra_lights -%}
            {% set name = device_attr(ent, 'name') | default('', true) | trim -%}
            {% if name != '' -%}
              {% set ns.names = ns.names + [name] -%}
            {% endif -%}
          {% endfor -%}
        {% endif -%}
        {% for line in z2m_dimming_extra_topics.splitlines() -%}
          {% set value = line | trim -%}
          {% if value != '' and not value.startswith('#') -%}
            {% set ns.names = ns.names + [value] -%}
          {% endif -%}
        {% endfor -%}
        {% for name in ns.names -%}
          {% if name.endswith('/set') and '/' in name -%}
            {% set topic = name -%}
          {% elif base != '' -%}
            {% set topic = base ~ '/' ~ name ~ '/set' -%}
          {% else -%}
            {% set topic = '' -%}
          {% endif -%}
          {% if topic != '' and topic not in ns.topics -%}
            {% set ns.topics = ns.topics + [topic] -%}
          {% endif -%}
        {% endfor -%}
        {{ ns.topics }}

  # Map normalized hardware events to physical buttons. Continuous dimming
  # only starts on keys for which the remote publishes a matching release.
  - variables:
      z2m_dimming_button_key: >-
        {% set ev = button_event | trim -%}
        {% set keys = {
          'arrow_left_hold': 'top_left' if switch_position == 'middle' else '',
          'arrow_left_release': 'top_left' if switch_position == 'middle' else '',
          'arrow_right_hold': 'top_right',
          'arrow_right_release': 'top_right',
          'toggle_hold': 'center' if switch_position == 'left' else '',
          'middle_release': 'center' if switch_position == 'left' else '',
          'brightness_up_hold': 'bottom_left',
          'brightness_up_release': 'bottom_left',
          'brightness_down_hold': 'bottom_right',
          'brightness_down_release': 'bottom_right'
        } -%}
        {{ keys.get(ev, '') }}
  - variables:
      z2m_dimming_button_mode: >-
        {% set modes = {
          'top_left': z2m_dimming_top_left_mode,
          'top_right': z2m_dimming_top_right_mode,
          'center': z2m_dimming_center_mode,
          'bottom_left': z2m_dimming_bottom_left_mode,
          'bottom_right': z2m_dimming_bottom_right_mode
        } -%}
        {{ modes.get(z2m_dimming_button_key | trim, 'custom') }}
      z2m_dimming_release_raw: >-
        {% set releases = {
          'top_left': 'arrow_left_release',
          'top_right': 'arrow_right_release',
          'center': 'arrow_left_release',
          'bottom_left': 'brightness_up_release',
          'bottom_right': 'brightness_down_release'
        } -%}
        {{ releases.get(z2m_dimming_button_key | trim, '') }}

  # Short presses always retain their existing actions. Only selected
  # hold/release events are replaced by Zigbee2MQTT brightness_move.
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ z2m_dimming_enabled and
                 z2m_dimming_button_key | trim != '' and
                 z2m_dimming_button_mode | trim in ['up', 'down'] and
                 (button_event.endswith('_hold') or
                  button_event.endswith('_release')) }}
        sequence:
          - if:
              - condition: template
                value_template: "{{ z2m_dimming_topics | count == 0 }}"
            then:
              - stop: >-
                  Zigbee2MQTT-dæmpning er aktiv, men ingen MQTT-topics blev
                  fundet. Vælg MQTT-lys-entiteter eller angiv friendly names
                  eller hele MQTT-command-topics.
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ button_event.endswith('_hold') }}"
                sequence:
                  - variables:
                      z2m_dimming_direction: >-
                        {{ 1 if z2m_dimming_button_mode | trim == 'up' else -1 }}
                  - repeat:
                      for_each: "{{ z2m_dimming_topics }}"
                      sequence:
                        - action: mqtt.publish
                          data:
                            topic: "{{ repeat.item }}"
                            payload: >-
                              {{ {'brightness_move': (z2m_dimming_direction | int) *
                                 (z2m_dimming_speed | int)} | to_json }}
                            retain: false
                  # Wait for this physical button's raw release, or another
                  # selected dimming hold. Do not stop a new movement when
                  # the previous button's wait ends due to a different hold.
                  - wait_template: >-
                      {% set ev = state_attr(z2m_dimming_remote, 'event_type') | default('', true) -%}
                      {% set active_holds = [
                        'arrow_left_hold' if
                          ((switch_position == 'middle' and z2m_dimming_top_left_mode != 'custom')
                          or (switch_position == 'left' and z2m_dimming_center_mode != 'custom'))
                          else '',
                        'arrow_right_hold' if z2m_dimming_top_right_mode != 'custom' else '',
                        'brightness_up_hold' if z2m_dimming_bottom_left_mode != 'custom' else '',
                        'brightness_down_hold' if z2m_dimming_bottom_right_mode != 'custom' else ''
                      ] -%}
                      {{ ev == z2m_dimming_release_raw | trim or
                         (ev != raw_button_event and ev in active_holds) }}
                    timeout:
                      seconds: "{{ z2m_dimming_timeout | int(15) }}"
                    continue_on_timeout: true
                  - if:
                      - condition: template
                        value_template: "{{ not wait.completed }}"
                    then:
                      - repeat:
                          for_each: "{{ z2m_dimming_topics }}"
                          sequence:
                            - action: mqtt.publish
                              data:
                                topic: "{{ repeat.item }}"
                                payload: '{"brightness_move": 0}'
                                retain: false

              # Release is a separate parallel run to stop immediately.
              - conditions:
                  - condition: template
                    value_template: "{{ button_event.endswith('_release') }}"
                sequence:
                  - repeat:
                      for_each: "{{ z2m_dimming_topics }}"
                      sequence:
                        - action: mqtt.publish
                          data:
                            topic: "{{ repeat.item }}"
                            payload: '{"brightness_move": 0}'
                            retain: false
          - stop: "Zigbee2MQTT-dæmpningshændelsen er behandlet."

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'toggle' }}"
        sequence: !input center_click_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'brightness_up_click' }}"
        sequence: !input brightness_up_click_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'brightness_down_click' }}"
        sequence: !input brightness_down_click_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'arrow_left_click' }}"
        sequence: !input arrow_left_click_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'arrow_right_click' }}"
        sequence: !input arrow_right_click_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'toggle_hold' }}"
        sequence: !input center_hold_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'brightness_up_hold' }}"
        sequence: !input brightness_up_hold_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'brightness_down_hold' }}"
        sequence: !input brightness_down_hold_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'arrow_left_hold' }}"
        sequence: !input arrow_left_hold_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'arrow_right_hold' }}"
        sequence: !input arrow_right_hold_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'brightness_up_release' }}"
        sequence: !input brightness_up_release_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'brightness_down_release' }}"
        sequence: !input brightness_down_release_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'arrow_left_release' }}"
        sequence: !input arrow_left_release_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'middle_release' }}"
        sequence: !input center_release_action
      - conditions:
          - condition: template
            value_template: "{{ button_event == 'arrow_right_release' }}"
        sequence: !input arrow_right_release_action
    default:
      - stop: "Ingen understøttet knaphændelse. Kontrollér valgt MQTT-event-entitet og omskifterposition. Se raw_button_event og button_event i sporingen."
